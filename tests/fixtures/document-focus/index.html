<!doctype html><meta charset="utf-8"><title>Document focus fixture</title>
<style>body{font:18px sans-serif;margin:30px;background:#fff;color:#111}button,input{font:18px sans-serif;margin:8px;padding:10px}iframe{display:inline-block;width:260px;height:80px;border:2px solid #446}pre{white-space:pre-wrap;font:18px monospace}</style>
<h1>Document focus</h1>
<p>Switch to another application, return, focus the address bar, then click this page.</p>
<input id="parentInput" placeholder="Parent input"><button id="toParent">Focus parent input</button>
<button id="toA">Focus frame A</button><button id="toB">Focus frame B</button>
<div><iframe id="a" title="A" srcdoc="<!doctype html><p>Frame A</p>"></iframe><iframe id="b" title="B" srcdoc="<!doctype html><p>Frame B</p>"></iframe></div>
<pre id="report">starting</pre>
<script>
(function(){
 var changes=[],a=document.getElementById('a'),b=document.getElementById('b'),input=document.getElementById('parentInput');
 function publish(kind){
  var state={kind:kind,document:typeof document.hasFocus==='function'?document.hasFocus():'missing',
   frameA:a.contentDocument&&typeof a.contentDocument.hasFocus==='function'?a.contentDocument.hasFocus():'missing',
   frameB:b.contentDocument&&typeof b.contentDocument.hasFocus==='function'?b.contentDocument.hasFocus():'missing',
   active:(document.activeElement&&document.activeElement.id)||'body',events:changes.join(',')};
  document.getElementById('report').textContent=JSON.stringify(state,null,2);
  console.log('DOC_FOCUS '+JSON.stringify(state));
 }
 addEventListener('focus',function(){changes.push('focus');publish('window-focus');});
 addEventListener('blur',function(){changes.push('blur');publish('window-blur');});
 document.addEventListener('focusin',function(){publish('element-focus');});
 document.getElementById('toParent').onclick=function(){input.focus();publish('parent');};
 document.getElementById('toA').onclick=function(){a.focus();publish('frame-a');};
 document.getElementById('toB').onclick=function(){b.focus();publish('frame-b');};
 publish('initial');
})();
</script>
