<!doctype html>
<html><head><meta charset="utf-8"><title>click battery</title>
<!--
  THE CLICK BATTERY (tests/fixtures/attack/click/, driven by
  tests/qmp/qmp_attack_click.py; same file, same click points, in headless
  Chrome as the oracle).

  Every target logs `CLK-<tag>` through console.log when it is hit -- the
  browser prints console.log lines RAW on the serial console (js_page.c
  con_out), so the tag is the whole line. After load the page prints its own
  geometry: `CLK-RECT <id> <x> <y> <w> <h>` (getBoundingClientRect, client
  coords), `CLK-VIEW <innerWidth> <innerHeight>`, `CLK-SCROLLY <scrollY>
  <documentElement.scrollTop>`, and `CLK-HIT <id> <elementFromPoint at the
  rect centre>` -- the CSSOM's own opinion of what a click there would target.
  The driver derives every click point from those lines; it never guesses a
  pixel. The same block is re-printed as CLK-RECT2/CLK-HIT2 after every
  `scroll` event (debounced), so a click after the user scrolled is still
  aimed by the page.

  Positions are ABSOLUTE and in document px on purpose: two engines lay flow
  out differently, and the point of the battery is the click chain, not the
  layout. The flex and grid targets are the deliberate exception.

  Colours on the pixel-located targets (#fe0102 xf, #01fe02 after_scroll,
  #fe01fe fixed_covered, #0102fe sc_hidden, #102030 hdr) are chosen to collide
  with nothing in the chrome or the wallpaper, so a screendump can find where
  the box was PAINTED without OCR -- the third channel, beside "where the page
  says it is" and "what the hit test picked".
-->
<style>

#z_low{background:#b0ffb0;z-index:1}
#scroller{position:absolute;left:660px;top:200px;width:150px;height:80px;overflow:auto;
          border:1px solid #444444;background:#f4f4f4}
#sc_inner{height:300px;position:relative}
#sc_top{position:absolute;left:5px;top:0;width:100px;height:40px;background:#c0c0ff}
#sc_hidden{position:absolute;left:5px;top:200px;width:100px;height:40px;background:#0102fe;color:#fff}

         grid-template-columns:1fr 2fr}
#grid_a{background:#eeeeee}
#grid_item{background:#a0ffe0;text-align:center;line-height:40px}
#fixed_covered{left:900px;top:320px;background:#fe01fe}
#bare{position:absolute;left:900px;top:380px;width:200px;height:40px}   /* no ink at all */
form{position:absolute;top:450px;margin:0}
#f1{left:10px} #f2{left:400px}
#fq,#fq2{width:150px;height:30px;font-size:16px;border:2px solid #444444;background:#ffffff}
#fsubmit{width:100px;height:36px;font:14px sans-serif;border:1px solid #444444}
#ablock_a{position:absolute;left:800px;top:450px;display:block;width:120px;height:60px;
          text-decoration:none}
#ablock{width:120px;height:60px;background:#d0ffd0;line-height:60px;text-align:center;color:#000}
#after_scroll{left:10px;top:800px;width:200px;background:#01fe02}
#body_probe{position:absolute;left:1000px;top:520px;width:10px;height:10px;background:#eee}
#flowrow{position:absolute;left:10px;top:505px;width:500px;height:40px;font-size:16px}
#chk2{width:20px;height:20px;vertical-align:middle}
#sel2{width:120px;height:36px;font-size:16px}
#btn2{width:100px;height:36px;font:14px sans-serif;border:1px solid #444444}
#para{position:absolute;left:230px;top:380px;width:400px;margin:0;font-size:18px;line-height:40px}
#a_inline{color:#0000cc;text-decoration:underline}
</style></head>
<body>

<div id="after_scroll" class="t">after scroll</div>

<script>
function log(t) { console.log('CLK-' + t); }
function tid(e) { var t = e && e.target; return t ? (t.id || t.tagName) : '?'; }
var $ = function (i) { return document.getElementById(i); };

/* every click, at the document and at the window: names the TARGET */
document.addEventListener('click', function (e) { log('doc:' + tid(e)); });
/* the two halves of a click, so a missing `click` says WHICH half went astray
   (qmp_forms.py paid a QEMU cycle to learn this the hard way) */
document.addEventListener('mousedown', function (e) { log('md:' + tid(e)); });
document.addEventListener('mouseup', function (e) { log('mu:' + tid(e)); });
window.addEventListener('click', function (e) { log('win:' + tid(e)); });

$('btn_listener').addEventListener('click', function () { log('btn_listener'); });
$('bubble_outer').addEventListener('click', function (e) { log('bubble_outer:' + tid(e)); });
$('noink').addEventListener('click', function () { log('noink'); });
$('svgbtn').addEventListener('click', function () { log('svgbtn'); });
$('mdmut').addEventListener('mousedown', function () {
  $('mdmut').innerHTML = '<span id="mdmut_in2">mutated</span>';
});
$('mdmut').addEventListener('click', function () { log('mdmut'); });
['mousedown', 'mouseup', 'click'].forEach(function (ty) {
  $('order').addEventListener(ty, function () { log('order:' + ty); });
});
$('dbl').addEventListener('click', function (e) { log('dbl:click:' + e.detail); });
$('dbl').addEventListener('dblclick', function () { log('dbl:dblclick'); });
$('txt').addEventListener('focus', function () { log('focus:txt'); });
$('lbl').addEventListener('click', function () { log('lbl'); });
$('chk').addEventListener('change', function () { log('chk:' + $('chk').checked); });
$('sel').addEventListener('change', function () { log('sel:' + $('sel').value); });
$('ce').addEventListener('focus', function () { log('focus:ce'); });
$('ce').addEventListener('click', function () { log('ce'); });
$('xf').addEventListener('click', function () { log('xf'); });
$('under_pe').addEventListener('click', function () { log('under_pe'); });
$('behind').addEventListener('click', function () { log('behind'); });
$('behind2').addEventListener('click', function () { log('behind2'); });
$('z_high').addEventListener('click', function () { log('z_high'); });
$('z_low').addEventListener('click', function () { log('z_low'); });
$('sc_top').addEventListener('click', function () { log('sc_top'); });
$('sc_hidden').addEventListener('click', function () { log('sc_hidden'); });
$('flex_item').addEventListener('click', function () { log('flex_item'); });
$('grid_item').addEventListener('click', function () { log('grid_item'); });
$('fixed_covered').addEventListener('click', function () { log('fixed_covered'); });
$('bare').addEventListener('click', function () { log('bare'); });
$('after_scroll').addEventListener('click', function () { log('after_scroll'); });
$('f1').addEventListener('submit', function (e) { log('submit:f1:' + (e.submitter ? e.submitter.id : '-')); });
$('f2').addEventListener('submit', function () { log('submit:f2'); });
$('fq2').addEventListener('focus', function () { log('focus:fq2'); });
$('ablock').addEventListener('click', function () { log('ablock'); });
$('chk2').addEventListener('change', function () { log('chk2:' + $('chk2').checked); });
$('sel2').addEventListener('change', function () { log('sel2:' + $('sel2').value); });
$('btn2').addEventListener('click', function () { log('btn2'); });
$('a_inline').addEventListener('click', function (e) { e.preventDefault(); log('a_inline'); });

/* the scroller starts scrolled: sc_hidden must be the visible one */
$('scroller').scrollTop = 200;

var IDS = ['hdr','a_plain','a_prevent','btn_attr','btn_listener','bubble_inner','noink',
  'svgbtn','mdmut_in','order','dbl','lbl','txt','chk','sel','ce','xf','deferred','modtarget',
  'under_pe','behind','behind2','z_high','scroller','sc_top','sc_hidden','flex_item',
  'grid_item','fixed_covered','bare','fq','fsubmit','fq2','ablock','after_scroll','body_probe',
  'chk2','sel2','btn2','a_inline','para'];

function report(suffix) {
  console.log('CLK-VIEW' + suffix + ' ' + window.innerWidth + ' ' + window.innerHeight);
  console.log('CLK-SCROLLY' + suffix + ' ' + window.scrollY + ' ' +
              document.documentElement.scrollTop + ' ' + $('scroller').scrollTop);
  for (var i = 0; i < IDS.length; i++) {
    var el = $(IDS[i]);
    if (!el) { console.log('CLK-RECT' + suffix + ' ' + IDS[i] + ' MISSING'); continue; }
    var r = el.getBoundingClientRect();
    var x = Math.round(r.left), y = Math.round(r.top), w = Math.round(r.width), h = Math.round(r.height);
    console.log('CLK-RECT' + suffix + ' ' + IDS[i] + ' ' + x + ' ' + y + ' ' + w + ' ' + h);
    var hit = '-';
    try {
      var e2 = document.elementFromPoint(x + Math.floor(w / 2), y + Math.floor(h / 2));
      hit = e2 ? (e2.id || e2.tagName) : 'null';
    } catch (err) { hit = 'ERR:' + err; }
    console.log('CLK-HIT' + suffix + ' ' + IDS[i] + ' ' + hit);
  }
  console.log('CLK-READY' + suffix);
}
var scrollTimer = 0;
window.addEventListener('scroll', function () {
  console.log('CLK-SCROLLED ' + window.scrollY);
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(function () { report('2'); }, 400);
});
window.addEventListener('load', function () { setTimeout(function () { report(''); }, 300); });
</script>
<script type="module">
document.getElementById('modtarget').addEventListener('click', function () { console.log('CLK-modtarget'); });
console.log('CLK-MODULE-RAN');
</script>
