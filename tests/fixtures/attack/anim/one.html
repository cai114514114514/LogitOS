<!doctype html>
<html><head><title>atk-anim-one</title>
<style>
/* ATTACK FIXTURE (a'): ONE box, ONE transition -- the bisect page.
 *
 * trans.html showed twelve boxes jumping to their end state at the first
 * restyle after the class toggle, while the tree's own gate
 * (tests/fixtures/anim/trans.html: one box, opacity only, no other script)
 * is recorded green. This page is that gate's shape with the differences
 * put on switches, so a run of its variants says WHICH difference costs
 * the transition:
 *
 *   ?prop=op|tf|both   what transitions (opacity .2->1 / translateX 0->200 / both)
 *   ?base=zero         declare `transform: translateX(0)` as the base instead
 *                      of leaving it `none` (does none -> translateX bridge?)
 *   ?nostamp=1         no rAF loop beside it (stamp.js)
 *   ?quiet=1           no console output between GO and DONE (stamp.js + here)
 */
html, body { background: #ffffff; margin: 0; padding: 0; }
#anchor { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; background: rgb(99,7,201); }
#clk    { position: absolute; left: 40px; top: 10px; width: 0px;  height: 20px; background: rgb(7,99,201); }
#clkt   { position: absolute; left: 40px; top: 34px; font: 12px monospace; color: #000; }
#o { position: absolute; left: 10px; top: 70px; width: 60px; height: 60px; background: rgb(254,1,3); }
</style>
<style>
/* The variant's CSS is written HERE by the fixture server (qmp_attack_anim.py
 * one_css) from the switches in the path; the first version wrote it with
 * document.write('<style>') and the guest did not apply a sheet added that
 * way. */
/*ONECSS*/
</style>
</head>
<body>
<div id="anchor"></div><div id="clk"></div><span id="clkt">0</span>
<div id="o"></div>
<script>window.__P = 'ONE';</script>
<script src="stamp.js"></script>
<script>
var BOXES = [ {id:'o', rgb:[254,1,3], x:10, y:70, kind: window.__KIND, why: window.__Q || location.search} ];
window.__say('ANIM-ONE-BOXES ' + JSON.stringify(BOXES));
window.__say('ANIM-ONE-CSS ' + window.__CSS.replace(/\n/g, ' '));
window.__say('ANIM-ONE-READY t=' + performance.now().toFixed(0));
setTimeout(function () {
  document.getElementById('o').className = 'go';
  /* ?gcs=1: read the computed style IN THE SAME TASK as the class change --
   * the cascade then runs inside getComputedStyle (css_ensure_styled), not
   * in the frame loop's restyle(), and the clock's pre-cascade snapshot is
   * not taken on that path. */
  if (/gcs=1/.test(window.__Q || location.search)) window.__say('ANIM-ONE-GCS op=' + getComputedStyle(document.getElementById('o')).opacity);
  window.__T0 = performance.now();
  window.__say('ANIM-ONE-GO t=' + window.__T0.toFixed(0));
  if (window.__QUIET) {
    setTimeout(function () { window.__say('ANIM-ONE-DONE t=' + performance.now().toFixed(0)); }, 3000);
    return;
  }
  [250, 600, 1200, 2500].forEach(function (d) {
    setTimeout(function () {
      var c = getComputedStyle(document.getElementById('o'));
      window.__say('ANIM-ONE-T' + d + ' t=' + performance.now().toFixed(0) + ' rel=' + (performance.now() - window.__T0).toFixed(0) + ' op=' + c.opacity + ' tf=' + c.transform);
    }, d);
  });
}, 1500);
</script>
</body></html>
