<!doctype html>
<html><head><title>atk-anim-raf</title>
<style>
/* ATTACK FIXTURE (c): script-driven motion -- requestAnimationFrame,
 * setInterval and a setTimeout(0) chain, each writing a different style
 * property. Speed is 100 px/s from the loop's own start so a screendump
 * stamped at t (stamp.js) expects the box at base + t/10. */
html, body { background: #ffffff; margin: 0; padding: 0; }
#anchor { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; background: rgb(99,7,201); }
#clk    { position: absolute; left: 40px; top: 10px; width: 0px;  height: 20px; background: rgb(7,99,201); }
#clkt   { position: absolute; left: 40px; top: 34px; font: 12px monospace; color: #000; }
.bx     { position: absolute; width: 60px; height: 60px; }
#r1 { left: 10px;  top: 70px;  background: rgb(254,1,3); }
#r2 { left: 10px;  top: 140px; background: rgb(3,1,254); }
#r3 { left: 10px;  top: 210px; background: rgb(1,254,3); opacity: 0; }
#r4 { left: 560px; top: 70px;  background: rgb(254,201,1); }
#r5 { left: 560px; top: 140px; background: rgb(201,1,254); }
#r6 { left: 560px; top: 210px; width: 200px; font: 16px monospace; color: #000; }
</style></head>
<body>
<div id="anchor"></div><div id="clk"></div><span id="clkt">0</span>
<div id="r1" class="bx"></div>
<div id="r2" class="bx"></div>
<div id="r3" class="bx"></div>
<div id="r4" class="bx"></div>
<div id="r5" class="bx"></div>
<div id="r6" class="bx">0</div>
<script>window.__P = 'RAF';</script>
<script src="stamp.js"></script>
<script>
var BOXES = [
  {id:'r1', rgb:[254,1,3],   x:10,  y:70,  kind:'js_left_100',  why:'rAF -> style.left'},
  {id:'r2', rgb:[3,1,254],   x:10,  y:140, kind:'js_xf_100',    why:'rAF -> style.transform translateX'},
  {id:'r3', rgb:[1,254,3],   x:10,  y:210, kind:'js_op_1s',     why:'rAF -> style.opacity 0->1 over 1 s'},
  {id:'r4', rgb:[254,201,1], x:560, y:70,  kind:'js_left_100',  why:'setInterval(16) -> style.left'},
  {id:'r5', rgb:[201,1,254], x:560, y:140, kind:'js_left_100',  why:'setTimeout(0) chain -> style.left'}
];
window.__say('ANIM-RAF-BOXES ' + JSON.stringify(BOXES));
var r1 = document.getElementById('r1'), r2 = document.getElementById('r2'), r3 = document.getElementById('r3'),
    r4 = document.getElementById('r4'), r5 = document.getElementById('r5'), r6 = document.getElementById('r6');
var T0 = performance.now(); window.__T0 = T0;
var nraf = 0, nint = 0, nchain = 0;
function raf(ts) {
  nraf++;
  var t = performance.now() - T0;
  r1.style.left = (10 + t / 10) + 'px';
  r2.style.transform = 'translateX(' + (t / 10) + 'px)';
  r3.style.opacity = Math.min(1, t / 1000);
  r6.textContent = 'raf ' + nraf + ' t=' + t.toFixed(0);
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);
setInterval(function () { nint++; var t = performance.now() - T0; r4.style.left = (560 + t / 10) + 'px'; }, 16);
(function chain() { nchain++; var t = performance.now() - T0; r5.style.left = (560 + t / 10) + 'px'; if (t < 3000) setTimeout(chain, 0); })();
window.__say('ANIM-RAF-READY t=' + T0.toFixed(0));
[250, 600, 1200, 2500].forEach(function (d) {
  setTimeout(function () {
    var t = performance.now() - T0;
    window.__say('ANIM-RAF-T' + d + ' t=' + performance.now().toFixed(0) + ' rel=' + t.toFixed(0) +
                 ' raf=' + nraf + ' int=' + nint + ' chain=' + nchain + ' r1.left=' + getComputedStyle(r1).left + ' r2.tf=' + getComputedStyle(r2).transform);
  }, d);
});
setTimeout(function () {
  window.__say('ANIM-RAF-DONE raf=' + nraf + ' int=' + nint + ' chain=' + nchain + ' rel=' + (performance.now() - T0).toFixed(0) + ' ' + window.__stamp.stats());
}, 3100);
</script>
</body></html>
