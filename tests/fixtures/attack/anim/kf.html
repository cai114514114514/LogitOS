<!doctype html>
<html><head><title>atk-anim-kf</title>
<style>
/* ATTACK FIXTURE (b): @keyframes animations, started by the sheet itself.
 *
 * Same box grid as trans.html (60x60, unique colours, column A left 10,
 * column B left 560, rows every 70 px). Every animation is 1 s. The clock
 * starts when the sheet is applied, which is ~when this page's script runs;
 * the picture's own stamp (#clk, stamp.js) says what t each screendump is. */
html, body { background: #ffffff; margin: 0; padding: 0; }
#anchor { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; background: rgb(99,7,201); }
#clk    { position: absolute; left: 40px; top: 10px; width: 0px;  height: 20px; background: rgb(7,99,201); }
#clkt   { position: absolute; left: 40px; top: 34px; font: 12px monospace; color: #000; }
.bx     { position: absolute; width: 60px; height: 60px; }

/* rotate(90deg), NOT 360: a 360-degree end state is the identity, so an engine
 * that jumps to the end or never rotates looks identical to one that spins.
 * The from-stop is IMPLICIT (the element's base, `none`) on purpose -- k16 is
 * the same spin with an explicit from { rotate(0) }, to separate "cannot
 * bridge none -> rotate()" from "cannot rotate at all". */
@keyframes spin  { to { transform: rotate(90deg); } }
@keyframes spin2 { from { transform: rotate(0deg); } to { transform: rotate(90deg); } }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(200px); } }
@keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
@keyframes mvleft { from { left: 560px; } to { left: 760px; } }
@keyframes there { 0% { transform: translateX(0); } 50% { transform: translateX(200px); } 100% { transform: translateX(0); } }
@keyframes paint { from { background-color: rgb(201,1,254); } to { background-color: rgb(1,201,254); } }
@-webkit-keyframes wkslide { from { -webkit-transform: translateX(0); transform: translateX(0); } to { -webkit-transform: translateX(200px); transform: translateX(200px); } }
@keyframes grow  { from { transform: scale(.5); } to { transform: scale(1); } }
@keyframes holdthenjump { 0% { transform: translateX(0); animation-timing-function: steps(1, end); } 100% { transform: translateX(200px); } }

/* k1  spin, a 120x40 bar: at 90 deg its bbox is 40x120 */
#k1 { left: 10px; top: 70px; width: 120px; height: 40px; background: rgb(254,1,3); animation: spin 1s linear infinite; }
/* k2  slide, shorthand, forwards */
#k2 { left: 10px; top: 140px; background: rgb(3,1,254); animation: slide 1s linear forwards; }
/* k3  fade 0 -> 1 */
#k3 { left: 10px; top: 210px; background: rgb(1,254,3); animation: fade 1s linear forwards; }
/* k4  three stops: 0 -> 200 -> 0, infinite */
#k4 { left: 10px; top: 280px; background: rgb(254,201,1); animation: there 1s linear infinite; }
/* k5  steps(4, end) */
#k5 { left: 10px; top: 350px; background: rgb(201,1,254); animation: slide 1s steps(4, end) forwards; }
/* k6  LONGHAND animation-* */
#k6 { left: 10px; top: 420px; background: rgb(254,101,1);
      animation-name: slide; animation-duration: 1s; animation-timing-function: linear; animation-fill-mode: forwards; }
/* k7  layout property: left */
#k7 { left: 560px; top: 70px; background: rgb(101,1,254); animation: mvleft 1s linear forwards; }
/* k8  500 ms delay, fill both */
#k8 { left: 560px; top: 140px; background: rgb(1,254,201); animation: slide 1s linear 500ms both; }
/* k9  background-color keyframes */
#k9 { left: 560px; top: 210px; background: rgb(254,1,201); animation: paint 1s linear forwards; }
/* k10 -webkit- prefixed shorthand + @-webkit-keyframes only */
#k10 { left: 560px; top: 280px; background: rgb(151,254,1); -webkit-animation: wkslide 1s linear forwards; }
/* k11 scale .5 -> 1: bbox 30 -> 60 */
#k11 { left: 560px; top: 350px; background: rgb(1,101,254); animation: grow 1s linear forwards; }
/* k12 per-keyframe easing: steps(1,end) on the 0% frame holds at 0 until t=1s */
#k12 { left: 560px; top: 420px; background: rgb(254,51,101); animation: holdthenjump 1s linear forwards; }
/* k13 animation declared behind a descendant selector ending in a CLASS */
.w13 .k13 { animation: slide 1s linear forwards; }
#k13 { left: 10px; top: 490px; background: rgb(51,101,254); }
/* k14 animation declared behind a descendant selector ending in a bare TAG */
.w14 div { animation: slide 1s linear forwards; }
#k14 { left: 560px; top: 490px; background: rgb(101,254,51); }
/* k15 spin with TEXT inside: the glyphs must rotate with the box */
#k16 { left: 300px; top: 140px; width: 120px; height: 40px; background: rgb(51,254,151); animation: spin2 1s linear infinite; }
#k15 { left: 300px; top: 70px; width: 120px; height: 40px; background: rgb(254,151,51); color: #000; font: bold 20px sans-serif; line-height: 40px; text-align: center; animation: spin 1s linear infinite; }
</style></head>
<body>
<div id="anchor"></div><div id="clk"></div><span id="clkt">0</span>
<div id="k1" class="bx"></div>
<div id="k2" class="bx"></div>
<div id="k3" class="bx"></div>
<div id="k4" class="bx"></div>
<div id="k5" class="bx"></div>
<div id="k6" class="bx"></div>
<div id="k7" class="bx"></div>
<div id="k8" class="bx"></div>
<div id="k9" class="bx"></div>
<div id="k10" class="bx"></div>
<div id="k11" class="bx"></div>
<div id="k12" class="bx"></div>
<div class="w13"><div id="k13" class="bx k13"></div></div>
<div class="w14"><div id="k14" class="bx"></div></div>
<div id="k15" class="bx">ROT</div>
<div id="k16" class="bx"></div>
<script>window.__P = 'KF';</script>
<script src="stamp.js"></script>
<script>
var BOXES = [
  {id:'k1', rgb:[254,1,3],   x:10,  y:70,  w:120, h:40, kind:'rot90_lin_inf', why:'spin 0->90deg 1s infinite, implicit from'},
  {id:'k2', rgb:[3,1,254],   x:10,  y:140, kind:'xf_lin_fwd',   why:'slide shorthand forwards'},
  {id:'k3', rgb:[1,254,3],   x:10,  y:210, kind:'op_lin_0_1',   why:'fade 0->1 forwards'},
  {id:'k4', rgb:[254,201,1], x:10,  y:280, kind:'xf_tri_inf',   why:'3 stops 0->200->0 infinite'},
  {id:'k5', rgb:[201,1,254], x:10,  y:350, kind:'xf_steps4',    why:'steps(4,end) forwards'},
  {id:'k6', rgb:[254,101,1], x:10,  y:420, kind:'xf_lin_fwd',   why:'LONGHAND animation-name/duration'},
  {id:'k7', rgb:[101,1,254], x:560, y:70,  kind:'left_lin_fwd', why:'layout property: left'},
  {id:'k8', rgb:[1,254,201], x:560, y:140, kind:'xf_delay500_fwd', why:'500 ms delay, both'},
  {id:'k9', rgb:[254,1,201], x:560, y:210, kind:'bg_lin_fwd',   why:'background-color keyframes'},
  {id:'k10',rgb:[151,254,1], x:560, y:280, kind:'xf_lin_fwd',   why:'-webkit-animation + @-webkit-keyframes only'},
  {id:'k11',rgb:[1,101,254], x:560, y:350, kind:'scale_lin_fwd',why:'scale .5->1 forwards'},
  {id:'k12',rgb:[254,51,101],x:560, y:420, kind:'xf_hold_jump', why:'per-keyframe steps(1,end) easing'},
  {id:'k13',rgb:[51,101,254],x:10,  y:490, kind:'xf_lin_fwd',   why:'animation behind descendant selector ending in .class'},
  {id:'k14',rgb:[101,254,51],x:560, y:490, kind:'xf_lin_fwd',   why:'animation behind descendant selector ending in bare tag'},
  {id:'k15',rgb:[254,151,51],x:300, y:70,  w:120, h:40, kind:'rot90_lin_inf', why:'spin with text child'},
  {id:'k16',rgb:[51,254,151],x:300, y:140, w:120, h:40, kind:'rot90_lin_inf', why:'spin, explicit from rotate(0deg)'}
];
function cs(tag) {
  ['k1','k2','k3','k5','k6','k7','k9','k12'].forEach(function (id) {
    var el = document.getElementById(id), c = getComputedStyle(el);
    window.__say('ANIM-KF-CS ' + tag + ' ' + id + ' tf=' + c.transform + ' op=' + c.opacity + ' left=' + c.left + ' bg=' + c.backgroundColor + ' an=' + c.animationName + '/' + c.animationDuration);
  });
}
window.__say('ANIM-KF-BOXES ' + JSON.stringify(BOXES));
window.__T0 = performance.now();
window.__say('ANIM-KF-READY t=' + window.__T0.toFixed(0));
if (!window.__QUIET) cs('T0');
if (window.__QUIET) setTimeout(function () { window.__say('ANIM-KF-DONE t=' + performance.now().toFixed(0)); }, 3000);
if (!window.__QUIET) [250, 600, 1200, 2500].forEach(function (d) {
  setTimeout(function () {
    window.__say('ANIM-KF-T' + d + ' t=' + performance.now().toFixed(0) + ' rel=' + (performance.now() - window.__T0).toFixed(0));
    cs('T' + d);
  }, d);
});
</script>
</body></html>
