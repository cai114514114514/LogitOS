<!doctype html>
<!-- GENERATED-BY-HAND for the text-alignment differential (tests/qmp/qmp_attack_text.py).
     The <style> and the measurement <script> are INLINE on purpose: an external
     stylesheet or script that arrives late in one engine and on time in the other
     would be a second experiment riding on this one. -->
<html><head><meta charset="utf-8"><title>txm p2 boxes</title>
<style>
/* Shared by text1/2/3.html -- the text-alignment differential fixtures.
 *
 * The four @font-face rules hand Chrome the SAME FONT BYTES the guest draws
 * with (the driver serves /fonts/ out of fsroot/fonts/), so a difference in a
 * rect is an ENGINE difference, not a font-metric one. LogitOS ignores
 * @font-face and picks its face from the generic keyword alone (css_engine.c:
 * CSS_FONT_FAMILY_MONOSPACE -> mono, anything else -> ui.ttf), which is why
 * every family list below ends in the generic that names the guest face.
 *
 * Every UA default that differs between the two browsers is pinned here
 * (p/table/td margins, padding, border-spacing), so a y difference cannot be
 * a stylesheet difference. */
@font-face{font-family:LogitUI;src:url(/fonts/ui.ttf);font-weight:400}
@font-face{font-family:LogitUI;src:url(/fonts/ui-bold.ttf);font-weight:700}
@font-face{font-family:LogitMono;src:url(/fonts/mono.ttf);font-weight:400}
@font-face{font-family:LogitMono;src:url(/fonts/mono-bold.ttf);font-weight:700}
html{background:#fff;color:#000;scrollbar-width:none}
body{margin:8px;font-family:LogitUI,sans-serif;font-size:16px;line-height:normal;font-weight:400}
p,div,table,tr,td,th,h1,h2,h3,ul,ol,li{margin:0;padding:0}
table{border-collapse:collapse;border-spacing:0}
td,th{padding:0;font-weight:400;text-align:left}
code,kbd,pre,.mono{font-family:LogitMono,monospace}
b,strong{font-weight:700}
.bg{background:#ffe680}
.sec{background:#eef3ff;margin:0 0 6px 0}
.ib{display:inline-block;width:24px;height:24px;background:#7fd8c0;margin:0;padding:0;border:0}
#txm-out{display:none}

</style></head><body>

<!-- (b) inline-block with every vertical-align value, all on one line -->
<div class="sec"><p id="b0" class="m bl">x<span class="ib m" id="b_baseline" style="vertical-align:baseline"></span>x<span class="ib m" id="b_top" style="vertical-align:top"></span>x<span class="ib m" id="b_middle" style="vertical-align:middle"></span>x<span class="ib m" id="b_bottom" style="vertical-align:bottom"></span>x<span class="ib m" id="b_texttop" style="vertical-align:text-top"></span>x<span class="ib m" id="b_textbottom" style="vertical-align:text-bottom"></span>x<span class="ib m" id="b_sub" style="vertical-align:sub"></span>x<span class="ib m" id="b_super" style="vertical-align:super"></span>x<span class="ib m" id="b_len" style="vertical-align:6px"></span>x<span class="ib m" id="b_neg" style="vertical-align:-6px"></span>x<span class="ib m" id="b_pct" style="vertical-align:50%"></span>x Hxg</p></div>

<!-- (f) table cells with vertical-align, 60px tall row -->
<div class="sec"><table id="f0" class="m"><tr>
<td id="f1" class="m" style="height:60px;width:120px;vertical-align:top;background:#dfd"><span id="f1s" class="m bg bl">top Hxg</span></td>
<td id="f2" class="m" style="height:60px;width:120px;vertical-align:middle;background:#ddf"><span id="f2s" class="m bg bl">middle Hxg</span></td>
<td id="f3" class="m" style="height:60px;width:120px;vertical-align:bottom;background:#fdd"><span id="f3s" class="m bg bl">bottom Hxg</span></td>
<td id="f4" class="m" style="height:60px;width:120px;background:#eee"><span id="f4s" class="m bg bl">default Hxg</span></td>
</tr></table></div>

<!-- (j) flex align-items: baseline -->
<div class="sec"><div id="j0" class="m" style="display:flex;align-items:baseline;background:#eef"><span id="j1" class="m bg bl" style="font-size:12px">small Hxg</span><span id="j2" class="m bg bl" style="font-size:28px;margin-left:8px">Large Hxg</span><span id="j3" class="m bg bl" style="font-size:16px;margin-left:8px;padding-top:20px">padded Hxg</span></div></div>

<!-- (l) text inside buttons and inputs -->
<div class="sec"><p id="l0" class="m bl">
<button id="l1" class="m">Click me</button>
<input id="l2" class="m" value="typed text">
<button id="l3" class="m" style="width:160px;height:48px;font-size:14px;padding:0">Wide Hxg</button>
<input id="l4" class="m" style="width:160px;height:40px;font-size:14px;padding:0 8px" value="tall Hxg">
</p></div>

<pre id="txm-out"></pre>
<script>
var TXM_PAGE = 'p2';
/* The measurement half of the text-alignment differential fixtures.
 *
 * Prints one line per measured element (class "m"):
 *   TXM <page> <phase> <id> <x> <y> <w> <h> base=<baseline-y | - | ERR>
 * and one per word of every "w" element, from a Range (Chrome only; LogitOS
 * has no createRange and prints NORANGE -- its word positions come from the
 * browser's own [dl] painted-text dump on the serial console instead):
 *   TXW <page> <phase> <id> <n> <word> <x> <y> <w> <h>
 *
 * base= is measured with a 0x0 inline-block probe appended to the element,
 * whose bottom edge sits on the baseline in a conforming engine. In LogitOS
 * an inline-block is a block (layout.c is_block) and getBoundingClientRect
 * reads the last COMPLETED layout, so the probe measures 0 there; the driver
 * derives the guest baseline from the [dl] run top + hhea.ascent instead and
 * checks that against the ink. The probe is removed synchronously, so the
 * guest's later relayout sees the original DOM.
 *
 * Two phases: t0 at load, t1 after document.fonts.ready + 1500 ms. The diff
 * uses t1 and reports t0 != t1 as its own finding. The same lines land in
 * #txm-out (display:none) so headless Chrome's --dump-dom carries them. */
function txmNum(v) { return Math.round(v * 100) / 100; }
function txmRect(e) {
  var r = e.getBoundingClientRect();
  return [txmNum(r.left), txmNum(r.top), txmNum(r.width), txmNum(r.height)];
}
function txmBaseline(e) {
  try {
    var p = document.createElement('span');
    p.setAttribute('style', 'display:inline-block;width:0;height:0;vertical-align:baseline;padding:0;margin:0;border:0;line-height:0');
    e.appendChild(p);
    var b = p.getBoundingClientRect().bottom;
    e.removeChild(p);
    return txmNum(b);
  } catch (x) { return 'ERR'; }
}
var TXM_OUT = [];
function txmEmit(s) { TXM_OUT.push(s); try { console.log(s); } catch (x) {} }
function txmWords(e, phase) {
  if (!document.createRange) { txmEmit('TXW ' + TXM_PAGE + ' ' + phase + ' ' + e.id + ' NORANGE'); return; }
  var n = 0;
  function walk(node) {
    if (node.nodeType === 3) {
      var s = node.nodeValue, i = 0;
      while (i < s.length) {
        while (i < s.length && /\s/.test(s.charAt(i))) i++;
        var j = i;
        while (j < s.length && !/\s/.test(s.charAt(j))) j++;
        if (j > i) {
          var rg = document.createRange();
          rg.setStart(node, i); rg.setEnd(node, j);
          var rs = rg.getClientRects();
          for (var k = 0; k < rs.length; k++) {
            var r = rs[k];
            txmEmit('TXW ' + TXM_PAGE + ' ' + phase + ' ' + e.id + ' ' + n + ' ' + s.substring(i, j) +
                    ' ' + txmNum(r.left) + ' ' + txmNum(r.top) + ' ' + txmNum(r.width) + ' ' + txmNum(r.height));
          }
          n++;
        }
        i = j;
      }
    } else {
      for (var c = node.firstChild; c; c = c.nextSibling) walk(c);
    }
  }
  /* LogitOS has createRange but no Range.getClientRects (measured: the first
     guest run died here with "getClientRects is not a function" and never
     reached its END line); a throw must not take the whole measurement down. */
  try { walk(e); } catch (x) { txmEmit('TXW ' + TXM_PAGE + ' ' + phase + ' ' + e.id + ' NORANGE ' + x); }
}
function txmMeasure(phase) {
  var els = document.querySelectorAll('.m');
  for (var i = 0; i < els.length; i++) {
    var e = els[i], r = txmRect(e);
    var b = (' ' + e.className + ' ').indexOf(' bl ') >= 0 ? txmBaseline(e) : '-';
    txmEmit('TXM ' + TXM_PAGE + ' ' + phase + ' ' + e.id + ' ' + r.join(' ') + ' base=' + b);
  }
  var ws = document.querySelectorAll('.w');
  for (var i = 0; i < ws.length; i++) txmWords(ws[i], phase);
  txmEmit('TXM ' + TXM_PAGE + ' ' + phase + ' END vw=' + window.innerWidth + ' vh=' + window.innerHeight +
          ' dpr=' + window.devicePixelRatio + ' ua=' + navigator.userAgent);
  var o = document.getElementById('txm-out');
  if (o) o.textContent = TXM_OUT.join('\n');
}
window.addEventListener('load', function () {
  txmMeasure('t0');
  var go = function () { setTimeout(function () { txmMeasure('t1'); }, 1500); };
  try {
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) document.fonts.ready.then(go, go);
    else go();
  } catch (x) { go(); }
});

</script>
</body></html>
