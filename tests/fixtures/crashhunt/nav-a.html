<!doctype html>
<!-- crashhunt: navigation churn side A. Deliberately boring and distinct from
     nav-b.html: the two titles differ so each `[browser] load:` line in the
     serial proves the navigation really happened. A timer keeps doing work
     while the tab is live, so each dehydrate/hydrate cycle tears down a page
     that is mid-animation -- the state a user's tabs are actually in. -->
<html>
<head>
<meta charset="utf-8">
<title>ch-nav-A</title>
<style>
body { background:#eef4ff; color:#1a2a44; margin:20px; font-size:16px; }
h1 { font-size:24px; }
.a { padding:2px 0; }
#c { font-size:20px; }
</style>
</head>
<body>
<h1>nav side A</h1>
<div id="c">0</div>
<script>
(function () {
  var n = 0;
  var c = document.getElementById('c');
  var t = setInterval(function () {
    n++;
    c.textContent = 'A tick ' + n;
    var d = document.createElement('div');
    d.className = 'a';
    d.appendChild(document.createTextNode('A row ' + n));
    document.body.appendChild(d);
    if (n > 4000) clearInterval(t);
  }, 100);
  console.log('CH-NAV-A-LOADED');
})();
</script>
</body>
</html>
