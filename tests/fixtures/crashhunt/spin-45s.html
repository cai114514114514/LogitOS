<!doctype html>
<!-- crashhunt: the 45-second question, made observable.

     js_page.c:240 sets JS_SLICE_MS_DEFAULT 45000: one synchronous JS entry
     (a script body, a timer callback) gets 45 s of wall clock; past it the
     interrupt handler fires (slice_interrupt, js_page.c:524) and the entry
     unwinds as an uncatchable InternalError with the serial lines

       [js] watchdog: script exceeded its CPU slice (wall time) -- interrupted
       [js] watchdog: fuel=... since_begin_ms=... js_ms=... ...

     THE CLAIM THIS FIXTURE TESTS IS "THE BROWSER SURVIVES IT": the abort
     kills the script entry, not the app and not the page. A browser that
     answers the driver's about:text ping after the bite is the proof.

     The spin is deliberately structured: 1 s of honest busy work at a time
     (a checksum loop), N+1 times, so the total slice crosses 45 s of
     IN-SCRIPT time without any network or DOM involvement -- the purest
     "legitimate but slow" shape the watchdog can bite. -->
<html>
<head>
<meta charset="utf-8">
<title>ch-spin</title>
<style>
body { background:#222; color:#eee; margin:20px; font-size:16px; }
#c { font-size:20px; }
</style>
</head>
<body>
<div id="c">spin starting</div>
<script>
(function () {
  var c = document.getElementById('c');
  var acc = 0, rounds = 0;
  // one synchronous entry that runs well past 45 s of script time
  function spin(ms) {
    var t0 = Date.now();
    var x = 0;
    while (Date.now() - t0 < ms) {       /* branches + calls: polled by QuickJS */
      for (var i = 0; i < 10000; i++) x = (x * 31 + i) | 0;
      acc += x;
    }
    return x;
  }
  /* THE SURVIVAL TIMER IS REGISTERED BEFORE THE SPIN, and that ordering is
     the point: the bite aborts the whole synchronous entry, so anything
     scheduled after the spin() call in this same script NEVER RUNS. The
     first run of this fixture registered the interval afterwards and
     CH-SPIN-ALIVE-AFTER never appeared -- not because the page died, but
     because the aborted script never reached the setInterval line. The
     browser's timer wheel is outside the aborted entry, so a timer that
     exists before the bite keeps firing after it. */
  var n = 0;
  var t = setInterval(function () {
    n++;
    c.textContent = 'alive after bite: ' + n;
    if (n === 3) { console.log('CH-SPIN-ALIVE-AFTER'); clearInterval(t); }
  }, 500);
  console.log('CH-SPIN-START');
  try {
    var r = spin(120000);                /* 120 s in ONE entry: must be bitten */
    console.log('CH-SPIN-COMPLETED acc=' + (acc + r));
  } catch (e) {
    /* NOTE: an InternalError thrown by the interrupt handler is UNCATACHABLE
       by spec of this port -- this handler is not expected to run; if it ever
       DOES log, catchability changed and that is worth knowing too. */
    console.log('CH-SPIN-CAUGHT ' + ((e && e.message) ? e.message : e));
  }
})();
</script>
</body>
</html>
