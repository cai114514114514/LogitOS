<!doctype html>
<!-- crashhunt: JS heap growth to a target, with the OOM CAUGHT.

     The point of catching the exception: QuickJS's out-of-memory is a JS
     exception (JS_ThrowOutOfMemory), so a page that grows the heap is the
     clean experiment for "does the engine's OOM path stay an exception, or
     does something under it fault the process?". A CH-HEAP-EXC line followed
     by CH-HEAP-DONE and a still-answering browser is the PASS shape for that
     question; a fault line instead is the finding.

     The retained array is never freed during the run: retained growth is the
     honest model of a leak-shaped page (analytics buffers, caches), which
     churn-shaped loops are not. ?mib=N is the target. -->
<html>
<head>
<meta charset="utf-8">
<title>ch-heap</title>
<style>
body { background:#1d2b22; color:#d8efe0; margin:24px; font-size:18px; }
#c { font-size:22px; }
</style>
</head>
<body>
<div id="c">js-heap starting</div>
<script>
(function () {
  var q = /mib=(\d+)/.exec(location.search || "");
  var WANT = q ? parseInt(q[1], 10) : 640;
  var keep = [];
  var got = 0, i = 0, exc = null;
  var c = document.getElementById('c');

  function chunk() {
    var s = 'x';
    while (s.length < (1 << 20)) s += s;      // 1 MiB string
    return s;
  }

  function step() {
    if (exc || got >= WANT) {
      console.log('CH-HEAP-DONE mib=' + got + ' exc=' + (exc ? 'yes' : 'no'));
      c.textContent = 'done ' + got + 'MiB' + (exc ? ' (caught ' + exc + ')' : '');
      return;
    }
    try {
      keep.push(chunk());
      got++;
      i++;
      if (i % 16 === 0) {
        console.log('CH-HEAP-ITER ' + got + 'MiB');
        c.textContent = got + '/' + WANT + ' MiB';
      }
    } catch (e) {
      exc = (e && e.message) ? e.message : ('' + e);
      console.log('CH-HEAP-EXC ' + exc);
    }
    setTimeout(step, 10);
  }
  step();
})();
</script>
</body>
</html>
