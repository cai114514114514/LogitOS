<!doctype html><html><head><title>jscost</title></head><body>
<div id="host"></div><div id="t" class="tt" data-k="0">text</div>
<script>
/* tests/fixtures/jscost/index.html -- ONE page that costs the five hypotheses.
 *
 * WHY A FIXTURE AND NOT TWO HARNESSES. The question is "of the wall clock in a
 * JS slice, which cost class is largest and what is the per-unit cost inside
 * it". Answering it needs one number per class measured the same way, and the
 * two places it can be measured disagree about what a clock is: the host probe
 * freezes its clock on purpose (webapi_probe.c:702) so a time-only watchdog
 * provably cannot fire there, and the device has a real 10 ms clock but no
 * access to the interpreter's counters. So this page reads whichever cost
 * source it is standing on -- __polls() on the host, performance.now() on the
 * device -- reports the UNIT it used, and the two runs are compared by SHAPE.
 * They are not comparable in units and nothing here pretends otherwise.
 *
 * EVERY BENCHMARK IS PAIRED WITH ITS OWN BASELINE. `el.nodeType` in a loop
 * costs the loop plus the crossing; `o.a` on a plain object in the same loop
 * costs the loop plus a property read that never leaves the interpreter. The
 * difference is the crossing and only the difference is quoted. Without that
 * subtraction every DOM number here would be an interpreter number wearing a
 * DOM name.
 *
 * THE CONTROL IS AT THE TOP AND IT HAS A KNOWN ANSWER. `for(i=0;i<n;i++) s+=i`
 * costs exactly 2.00 poll events per iteration -- the loop test and the back
 * edge -- which is read out of quickjs.c and re-derived by
 * webapi_probe --prof-selftest. If __polls() does not say 2.00 here, the
 * counter is not counting what this page thinks it counts and no row below
 * means anything. On the device there is no counter, so the control is
 * linearity instead: the same loop at n and 2n must cost 2x. */
var HAVE_POLLS = (typeof __polls === 'function');
var UNIT = HAVE_POLLS ? 'polls' : 'ms';
var OUT = [];
function say(s) { console.log(s); }
function cost() { return HAVE_POLLS ? __polls() : performance.now(); }

/* Run fn(n) enough times to be measurable, return [total_cost, total_ops].
 * On the host the counter is exact, so one pass is the measurement. On the
 * device performance.now() ticks at 10 ms (browser.c's clock is monotonic_ms),
 * so a block shorter than that reads as zero -- doubling until 250 ms gives
 * every row at least a 4% resolution, which is stated rather than assumed. */
function timeit(fn, n) {
  if (HAVE_POLLS) { var a = cost(); fn(n); var b = cost(); return [b - a, n]; }
  var reps = 1, t0 = 0, t1 = 0;
  for (;;) {
    t0 = performance.now();
    for (var r = 0; r < reps; r++) fn(n);
    t1 = performance.now();
    if ((t1 - t0) >= 250 || reps >= 8192) break;
    reps = reps * 2;
  }
  return [t1 - t0, n * reps];
}
/* class: which hypothesis the row belongs to. base: the row whose cost is
 * subtracted to isolate this one. */
function row(cls, name, K, c, ops, base) {
  say('JSCOST|' + cls + '|' + name + '|' + K + '|' + ops + '|' + c + '|' + UNIT
      + '|' + (base === undefined ? '' : base));
}
function bench(cls, name, K, fn, n, basename) {
  var r;
  try { r = timeit(fn, n); }
  catch (e) { say('JSCOST|' + cls + '|' + name + '|' + K + '|0|0|' + UNIT + '|ERR ' + e); return; }
  row(cls, name, K, r[0], r[1], basename);
}

var doc = document, D = doc.getElementById('t'), HOSTEL = doc.getElementById('host');
var sink = 0, osink = null;
var plain = { a: 1, b: 2 };
function idfn(x) { return x + 1; }

/* ---------------- (a) interpretation, and the control ------------------- */
function b_loop(n) { var s = 0; for (var i = 0; i < n; i++) s += i; sink = s; }
function b_loop2(n) { var s = 0; for (var i = 0; i < n * 2; i++) s += i; sink = s; }
function b_call(n) { var s = 0; for (var i = 0; i < n; i++) s = idfn(s); sink = s; }
function b_prop(n) { var s = 0, o = plain; for (var i = 0; i < n; i++) s += o.a; sink = s; }
function b_str(n) { var s = 0; for (var i = 0; i < n; i++) s += ('x' + i).length; sink = s; }

/* ---------------- (b) the C boundary ------------------------------------ */
function b_nodeType(n)  { var s = 0, e = D; for (var i = 0; i < n; i++) s += e.nodeType; sink = s; }
function b_tagName(n)   { var s = 0, e = D; for (var i = 0; i < n; i++) s += e.tagName.length; sink = s; }
function b_firstChild(n){ var o = null, e = D; for (var i = 0; i < n; i++) o = e.firstChild; osink = o; }
function b_parentNode(n){ var o = null, e = D; for (var i = 0; i < n; i++) o = e.parentNode; osink = o; }
function b_className(n) { var s = 0, e = D; for (var i = 0; i < n; i++) s += e.className.length; sink = s; }
function b_getAttr(n)   { var s = 0, e = D; for (var i = 0; i < n; i++) s += e.getAttribute('data-k').length; sink = s; }
function b_setAttr(n)   { var e = D; for (var i = 0; i < n; i++) e.setAttribute('data-k', '1'); }
function b_gebi(n)      { var o = null; for (var i = 0; i < n; i++) o = doc.getElementById('t'); osink = o; }
function b_style(n)     { var s = 0, e = D; for (var i = 0; i < n; i++) s += e.style.width.length; sink = s; }
function b_create(n)    { var o = null; for (var i = 0; i < n; i++) o = doc.createElement('div'); osink = o; }
function b_textContent(n){ var s = 0, e = D; for (var i = 0; i < n; i++) s += e.textContent.length; sink = s; }

/* ---------------- (e) layout / paint re-entered from script ------------- */
function b_offsetWidth(n) { var s = 0, e = D; for (var i = 0; i < n; i++) s += e.offsetWidth; sink = s; }
function b_gbcr(n)        { var s = 0, e = D; for (var i = 0; i < n; i++) s += e.getBoundingClientRect().width; sink = s; }
function b_thrash(n)      { var s = 0, e = D; for (var i = 0; i < n; i++) { e.style.width = (100 + (i & 7)) + 'px'; s += e.offsetWidth; } sink = s; }

/* ---------------- (c) the quadratic scan -------------------------------- */
/* A parent with K children, rebuilt for each K. Cost is reported per K so a
 * per-operation cost that RISES with K is the shape being hunted; a flat
 * column is a linear operation and the hypothesis dies for that row. */
var P = null, KNOW = 0;
function buildK(K) {
  if (P) HOSTEL.removeChild(P);
  P = doc.createElement('div');
  P.id = 'p';
  for (var i = 0; i < K; i++) {
    var c = doc.createElement('div');
    c.className = 'x';
    c.id = 'n' + i;
    c.appendChild(doc.createTextNode('c' + i));
    P.appendChild(c);
  }
  HOSTEL.appendChild(P);
  KNOW = K;
}
function q_len(n)    { var s = 0; for (var i = 0; i < n; i++) s += P.children.length; sink = s; }
function q_last(n)   { var o = null, k = KNOW - 1; for (var i = 0; i < n; i++) o = P.children[k]; osink = o; }
function q_first(n)  { var o = null; for (var i = 0; i < n; i++) o = P.children[0]; osink = o; }
function q_walk(n)   { var s = 0; for (var r = 0; r < n; r++) { var ch = P.children; for (var i = 0; i < ch.length; i++) s += ch[i].nodeType; } sink = s; }
function q_sibwalk(n){ var s = 0; for (var r = 0; r < n; r++) { for (var e = P.firstChild; e; e = e.nextSibling) s++; } sink = s; }
function q_qsa(n)    { var s = 0; for (var i = 0; i < n; i++) s += doc.querySelectorAll('#p > .x').length; sink = s; }
function q_gebtn(n)  { var s = 0; for (var i = 0; i < n; i++) s += P.getElementsByTagName('div').length; sink = s; }
function q_gebi(n)   { var o = null, id = 'n' + (KNOW - 1); for (var i = 0; i < n; i++) o = doc.getElementById(id); osink = o; }
function q_text(n)   { var s = 0; for (var i = 0; i < n; i++) s += P.textContent.length; sink = s; }
function q_html(n)   { var s = 0; for (var i = 0; i < n; i++) s += P.innerHTML.length; sink = s; }
function q_appendrm(n){ for (var i = 0; i < n; i++) { var c = doc.createElement('span'); P.appendChild(c); P.removeChild(c); } }
function q_insfirst(n){ for (var i = 0; i < n; i++) { var c = doc.createElement('span'); P.insertBefore(c, P.firstChild); P.removeChild(c); } }
function q_setall(n) { for (var r = 0; r < n; r++) { var ch = P.children; for (var i = 0; i < ch.length; i++) ch[i].setAttribute('data-j', r); } }

/* ------------------------------------------------------------------------ */
/* Each task is its own setTimeout callback, which matters on the device: a
 * timer callback calls js_page_slice_begin() and so gets a fresh 45 s budget.
 * Running the whole suite inside one <script> would put every row inside one
 * slice and the watchdog would eat the tail of the table. */
var N = HAVE_POLLS ? 20000 : 4000;
var KS = [4, 32, 256, 2048];
var tasks = [];
function push(f) { tasks.push(f); }

push(function () {
  say('JSCOST-UNIT|' + UNIT + '|have_polls=' + HAVE_POLLS);
  /* the control */
  var a = timeit(b_loop, N), b = timeit(b_loop2, N);
  row('ctl', 'loop_n', 0, a[0], a[1]);
  row('ctl', 'loop_2n', 0, b[0], b[1]);
  if (HAVE_POLLS) say('JSCOST-CTL|polls_per_iter=' + (a[0] / N).toFixed(4)
                      + '|want 2.0000 (the loop test and the back edge)');
  say('JSCOST-CTL|linearity=' + (a[0] ? (b[0] / a[0]).toFixed(4) : 'NA') + '|want 2.0000');
});
push(function () {
  bench('a', 'loop_add', 0, b_loop, N);
  bench('a', 'js_call', 0, b_call, N, 'loop_add');
  bench('a', 'js_prop', 0, b_prop, N, 'loop_add');
  bench('a', 'js_strcat', 0, b_str, N, 'loop_add');
});
push(function () {
  bench('b', 'dom_nodeType', 0, b_nodeType, N, 'js_prop');
  bench('b', 'dom_tagName', 0, b_tagName, N, 'js_prop');
  bench('b', 'dom_className', 0, b_className, N, 'js_prop');
  bench('b', 'dom_firstChild', 0, b_firstChild, N, 'js_prop');
  bench('b', 'dom_parentNode', 0, b_parentNode, N, 'js_prop');
});
push(function () {
  bench('b', 'dom_getAttribute', 0, b_getAttr, N, 'js_prop');
  bench('b', 'dom_setAttribute', 0, b_setAttr, N, 'loop_add');
  bench('b', 'dom_getElementById', 0, b_gebi, N, 'js_prop');
  bench('b', 'dom_style_width', 0, b_style, N, 'js_prop');
  bench('b', 'dom_createElement', 0, b_create, N / 4, 'loop_add');
  bench('b', 'dom_textContent', 0, b_textContent, N / 4, 'js_prop');
});
push(function () {
  bench('e', 'offsetWidth', 0, b_offsetWidth, N / 4, 'js_prop');
  bench('e', 'getBoundingClientRect', 0, b_gbcr, N / 4, 'js_prop');
  bench('e', 'style_write_then_read', 0, b_thrash, N / 8, 'js_prop');
});
for (var ki = 0; ki < KS.length; ki++) {
  (function (K) {
    push(function () {
      var t0 = cost(); buildK(K); var t1 = cost();
      row('c', 'build_K_children', K, t1 - t0, K);
    });
    push(function () {
      var M = HAVE_POLLS ? 4000 : 1000;
      bench('c', 'children_length', K, q_len, M);
      bench('c', 'children_first', K, q_first, M);
      bench('c', 'children_last', K, q_last, M);
      bench('c', 'getElementById_deep', K, q_gebi, M);
    });
    push(function () {
      var W = HAVE_POLLS ? 40 : 20;
      bench('c', 'children_full_walk', K, q_walk, W);
      bench('c', 'sibling_full_walk', K, q_sibwalk, W);
      bench('c', 'querySelectorAll', K, q_qsa, W);
      bench('c', 'getElementsByTagName', K, q_gebtn, W);
    });
    push(function () {
      var W = HAVE_POLLS ? 40 : 10;
      bench('c', 'textContent_read', K, q_text, W);
      bench('c', 'innerHTML_read', K, q_html, W);
      bench('c', 'setAttribute_all', K, q_setall, W);
    });
    push(function () {
      var M = HAVE_POLLS ? 2000 : 400;
      bench('c', 'append_then_remove', K, q_appendrm, M);
      bench('c', 'insert_first_then_remove', K, q_insfirst, M);
    });
  })(KS[ki]);
}
push(function () { say('JSCOST-DONE'); });

var ti = 0;
function step() {
  if (ti >= tasks.length) return;
  var f = tasks[ti++];
  f();
  setTimeout(step, 0);
}
setTimeout(step, 0);
</script></body></html>
