<!doctype html><meta charset="utf-8"><title>Modal dialog interaction</title>
<style>
body{margin:32px;font:18px sans-serif;color:#243447;background:#f5f7fa}
h1{font-size:28px}button,input{font-size:18px;margin:8px;padding:10px}
.panel{padding:20px;background:#ffffff;border:1px solid #bac8d7;margin:20px 0}
#pagebanner{position:relative;z-index:2147483647;color:#873b36;background:#f8e5dc;padding:14px}
dialog{width:420px;padding:24px;border:2px solid #17683d;background:white;color:#243447}
dialog h2{font-size:26px;margin:0 0 16px}dialog p{margin:12px 0}
#status{color:#17683d}
</style>
<h1>A focused conversation</h1>
<p id="pagebanner">This page banner stays below an open modal.</p>
<div class="panel"><button id="open">Open dialog</button><button id="background">Background action</button><p id="status">Background action count: 0</p></div>
<p>Within the dialog, Tab moves between its controls. Escape closes it and returns focus to Open dialog.</p>
<dialog id="dialog"><h2>Your details</h2><p>The background is dimmed and cannot be activated.</p><input id="name" autofocus placeholder="Type your name"><button id="save">Save and close</button><button id="cancel">Cancel</button></dialog>
<script>
var dialog=document.getElementById('dialog'),openButton=document.getElementById('open'),count=0;
openButton.addEventListener('click',function(){dialog.showModal();});
document.getElementById('background').addEventListener('click',function(){count++;document.getElementById('status').textContent='Background action count: '+count;});
document.getElementById('save').addEventListener('click',function(){dialog.close('saved');});
document.getElementById('cancel').addEventListener('click',function(){dialog.close('canceled');});
dialog.addEventListener('close',function(){document.getElementById('status').textContent='Dialog closed. Background action count: '+count;});
openButton.focus();dialog.showModal();
</script>
