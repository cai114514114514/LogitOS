<!doctype html><meta charset="utf-8"><title>Grid percentage item sizing</title><style>body{font:18px sans-serif;margin:20px}.grid{display:grid;width:320px;grid-template-columns:repeat(3,1fr);gap:10px}.grid>a{display:inline-block;width:100%;height:26px;border:1px solid;box-sizing:content-box;background:#ddf4ee}</style><h1>Grid percentage widths</h1><p>Three equal links occupy a 320px grid; each content box is 100px wide.</p><div class="grid"><a id="a">One</a><a id="b">Two</a><a id="c">Three</a></div><p id="result"></p><script>var a=document.getElementById('a').getBoundingClientRect(),b=document.getElementById('b').getBoundingClientRect(),c=document.getElementById('c').getBoundingClientRect();var ok=a.width===102&&b.x-a.x===110&&c.x-a.x===220;var m=(ok?'PASS':'FAIL')+' width='+a.width+' offsets='+(b.x-a.x)+','+(c.x-a.x);document.getElementById('result').textContent=m;console.log('GRID-PERCENTAGE-ITEM '+m);</script>
