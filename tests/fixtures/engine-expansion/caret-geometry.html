<!doctype html>
<meta charset="utf-8">
<title>Native caret geometry specimens</title>
<style>
body { margin:16px; font:16px sans-serif; color:#18212b; background:white; }
h1 { font-size:22px; margin:0 0 8px; }
p { margin:5px 0 12px; }
.row { display:flex; align-items:center; gap:12px; margin:8px 0; }
label { display:block; width:110px; }
button { width:130px; height:32px; font-size:15px; }
input, textarea, .editor { width:360px; padding:5px; border:2px solid #17a358; background:white; color:#18212b; font-size:20px; }
input { height:28px; }
textarea { height:48px; white-space:pre; }
.editor { min-height:28px; white-space:pre; }
#ce-letter { letter-spacing:3px; }
#ce-word { word-spacing:12px; }
#ce-mixed { letter-spacing:2px; word-spacing:8px; overflow:auto; height:34px; }
#status { margin-top:12px; white-space:pre-wrap; font:14px monospace; }
</style>
<h1>Native caret geometry</h1>
<p>Use a Focus button, then physical End, Left, Z and mouse clicks. Values are initialized once; this page does not emulate editing.</p>
<div class="row"><label for="ascii">Long ASCII</label><input id="ascii"><button id="focus-ascii">Focus ASCII</button></div>
<div class="row"><label for="cjk">Long CJK</label><input id="cjk"><button id="focus-cjk">Focus CJK</button></div>
<div class="row"><label for="mixed">Long mixed</label><input id="mixed"><button id="focus-mixed">Focus mixed</button></div>
<div class="row"><label for="password">Password</label><input id="password" type="password"><button id="focus-password">Focus password</button></div>
<div class="row"><label for="long-line">Textarea</label><textarea id="long-line" wrap="off"></textarea><button id="focus-long-line">Focus textarea</button></div>
<div class="row"><label>Letter spacing</label><div id="ce-letter" class="editor" contenteditable="true">WiWi 中文 End</div><button id="focus-ce-letter">Focus letters</button></div>
<div class="row"><label>Word spacing</label><div id="ce-word" class="editor" contenteditable="true">Wi word 中 End</div><button id="focus-ce-word">Focus words</button></div>
<div class="row"><label>Mixed scrolling</label><div id="ce-mixed" class="editor" contenteditable="true"></div><button id="focus-ce-mixed">Focus CE scroll</button></div>
<div id="status">Waiting for native input.</div>
<script>
(function () {
    var ids = ['ascii', 'cjk', 'mixed', 'password', 'long-line', 'ce-letter', 'ce-word', 'ce-mixed'];
    function repeat(s, n) { var out = ''; while (n-- > 0) out += s; return out; }
    document.getElementById('ascii').value = repeat('Wi', 800);
    document.getElementById('cjk').value = repeat('中文', 300);
    document.getElementById('mixed').value = repeat('Wi中文', 200);
    document.getElementById('password').value = repeat('Wi', 700);
    document.getElementById('long-line').value = repeat('Wi中文', 200) + '\nSecond line';
    document.getElementById('ce-mixed').textContent = repeat('Wi 中文 word ', 24) + 'End';

    function box(id) {
        var el = document.getElementById(id), r = el.getBoundingClientRect();
        console.log('CARET-BOX ' + JSON.stringify({id:id,x:r.left,y:r.top,w:r.width,h:r.height}));
    }
    function snapshot(el, cause) {
        var textual = el.tagName === 'INPUT' || el.tagName === 'TEXTAREA';
        var value = textual ? el.value : el.textContent;
        var state = {id:el.id,cause:cause,length:value.length,scrollLeft:el.scrollLeft,scrollTop:el.scrollTop};
        if (textual) {
            state.start = el.selectionStart;
            state.end = el.selectionEnd;
        } else {
            var selection = window.getSelection();
            state.anchor = selection ? selection.anchorOffset : -1;
            state.focus = selection ? selection.focusOffset : -1;
            state.focusText = !!(selection && selection.focusNode && selection.focusNode.nodeType === 3);
        }
        state.tail = el.id === 'password' ? '(masked fixture)' : value.slice(-16);
        console.log('CARET-STATE ' + JSON.stringify(state));
        document.getElementById('status').textContent = JSON.stringify(state);
    }
    ids.forEach(function (id) {
        var el = document.getElementById(id);
        document.getElementById('focus-' + id).addEventListener('click', function () {
            // Focus is fixture setup only. End/Left/typing/clicks must arrive
            // through native browser input; no setSelectionRange or edit shim.
            el.focus();
            snapshot(el, 'focus-button');
        });
        el.addEventListener('keydown', function (event) {
            console.log('CARET-KEY ' + id + ' key=' + event.key);
            setTimeout(function () { snapshot(el, 'after-key:' + event.key); }, 0);
        });
        el.addEventListener('input', function () { snapshot(el, 'input'); });
        el.addEventListener('click', function () {
            setTimeout(function () { snapshot(el, 'after-native-click'); }, 0);
        });
    });
    document.getElementById('ascii').focus();
    setTimeout(function () {
        ids.forEach(function (id) { box(id); box('focus-' + id); });
        snapshot(document.getElementById('ascii'), 'initial');
        console.log('CARET-READY specimens=' + ids.length + ' units=CSS-pixels offsets=UTF16');
    }, 150);
})();
</script>
