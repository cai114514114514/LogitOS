<!doctype html><meta charset="utf-8"><title>Grid font unit bases</title><style>html{font-size:20px}body{margin:20px;color:#17334b}.grid{display:grid;font-size:32px;grid-template-columns:2rem 2em 1fr;width:300px;background:#eaf4ff}.grid>div{height:60px}.a{background:#228855}.b{background:#f4c84c}</style><h1>Grid rem and em</h1><p>Root font:20px. Grid font:32px. Green:2rem=40px. Yellow:2em=64px.</p><div class="grid"><div id="rem" class="a">R</div><div id="em" class="b">E</div><div id="rest">fr</div></div><p id="result"></p><script>var r=document.getElementById('rem').getBoundingClientRect().width,e=document.getElementById('em').getBoundingClientRect().width,f=document.getElementById('rest').getBoundingClientRect().width;var m=(r===40&&e===64&&f===196?'PASS':'FAIL')+' rem='+r+' em='+e+' fr='+f;document.getElementById('result').textContent=m;console.log('GRID-FONT-UNITS '+m);</script>
