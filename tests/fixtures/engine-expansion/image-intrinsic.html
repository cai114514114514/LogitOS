<!doctype html><meta charset=utf-8><title>Decoded image geometry</title>
<style>
body{margin:24px;font:20px/24px sans-serif}h1{margin:0 0 16px;height:40px;font-size:28px}
#flow-image{display:block;width:240px;height:auto}#following{margin:0;height:24px}
#cards{display:flex;width:600px;gap:20px;margin-top:24px;align-items:flex-start}
picture{display:block}picture img{display:block;width:auto;height:50px}
#direct{width:120px;height:auto}
</style>
<h1>Decoded dimensions drive layout</h1>
<img id=flow-image src=/intrinsic-delayed.svg alt="Green image">
<p id=following>Title immediately below the image</p>
<section id=cards><picture id=wrapper><img id=ratio src=/intrinsic-delayed.svg></picture><img id=direct src=/intrinsic-delayed.svg></section>
<script>
window.addEventListener('load',function(){
 if(location.pathname.indexOf('passive')>=0){console.log('IMAGE-INTRINSIC-PASSIVE LOADED');return;}
 var f=document.getElementById('flow-image'),a=f.getBoundingClientRect(),t=document.getElementById('following').getBoundingClientRect(),p=document.getElementById('wrapper').getBoundingClientRect(),r=document.getElementById('ratio').getBoundingClientRect(),d=document.getElementById('direct').getBoundingClientRect();
 var ok=f.complete&&f.naturalWidth===240&&f.naturalHeight===100&&a.width===240&&a.height===100&&t.top===a.bottom&&p.width===120&&r.width===120&&r.height===50&&d.width===120&&d.height===50;
 console.log('IMAGE-INTRINSIC '+(ok?'PASS':'FAIL')+' '+JSON.stringify({flow:[a.width,a.height],titleDelta:t.top-a.bottom,picture:p.width,ratio:[r.width,r.height],direct:[d.width,d.height]}));
});
</script>
