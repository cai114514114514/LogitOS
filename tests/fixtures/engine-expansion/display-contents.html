<!doctype html><meta charset="utf-8"><title>Boxless navigation wrappers</title><style>body{font:18px sans-serif;margin:20px}nav{display:flex;width:360px;background:#eaf4ff;border:2px solid #17334b}.contents{display:contents}.inherit{display:inherit}.item{width:80px;height:40px;flex:none;background:#228855;color:white}p{max-width:600px}</style><h1>Boxless navigation wrappers</h1><p>The three items must appear side by side. The nested DOM wrappers have display:contents and display:inherit.</p><nav><div class="contents" id="wrap"><div class="inherit"><div class="inherit"><div class="item" id="a">One</div><div class="item" id="b">Two</div></div></div></div><div class="item" id="c">Three</div></nav><p id="result"></p><script>var a=document.getElementById('a').getBoundingClientRect(),b=document.getElementById('b').getBoundingClientRect(),c=document.getElementById('c').getBoundingClientRect(),wrap=document.getElementById('wrap').getBoundingClientRect();var ok=b.x-a.x===80&&c.x-a.x===160&&a.y===b.y&&b.y===c.y&&wrap.width===0&&wrap.height===0;var m=(ok?'PASS':'FAIL')+' item offsets='+(b.x-a.x)+','+(c.x-a.x)+' wrapper='+wrap.width+'x'+wrap.height;document.getElementById('result').textContent=m;console.log('DISPLAY-CONTENTS '+m);</script>
