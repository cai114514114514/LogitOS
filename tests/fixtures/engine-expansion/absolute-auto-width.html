<!doctype html><meta charset="utf-8"><title>Positioned content widths</title>
<style>
body{margin:20px;font:16px sans-serif;background:#f3f6fc}
#reference{visibility:hidden}
#panel{position:fixed;inset:0;margin:auto;box-sizing:border-box;width:420px;height:220px;border:2px solid #26785c;background:white}
#close{position:absolute;right:10px;top:10px}
#under{position:absolute;left:20px;top:15px;width:100px;height:32px}
#hint{position:absolute;right:20px;top:70px;background:#f3d878}
#picture{position:absolute;left:20px;top:100px}
</style>
<h1>Ordinary positioned controls and image</h1><button id="reference">Close</button><p id="status">Ready</p>
<section id="panel"><button id="under">Count click</button><button id="close">Close</button><div id="hint">Narrow label</div><img id="picture" src="/range-cover.svg" alt="Green sample"></section>
<script>
// These rects only observe authored layout after the real image load. The
// native driver must hit the separate Count button, then the small Close
// control; an over-wide transparent control must not swallow the first click.
var panel=document.getElementById('panel'),closeButton=document.getElementById('close'),under=document.getElementById('under'),count=0;
function rect(id){var r=document.getElementById(id).getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height}}
function center(r){return {x:r.x+r.w/2,y:r.y+r.h/2}}
under.addEventListener('click',function(){count++;document.getElementById('status').textContent='Count '+count;console.log('AUTO-WIDTH UNDER '+count)});
closeButton.addEventListener('click',function(){panel.style.display='none';document.getElementById('status').textContent='Panel closed';console.log('AUTO-WIDTH CLOSED count='+count)});
console.log('LOAD-PROBE-SCRIPT');
window.addEventListener('load',function(){
 var p=rect('panel'),b=rect('close'),reference=rect('reference'),i=rect('picture'),h=rect('hint');
 var good=b.w===reference.w&&Math.abs(b.x+b.w-(p.x+p.w-12))<=1&&h.w>0&&h.w<p.w/2&&i.w===240&&i.h===100;
 console.log('AUTO-WIDTH '+(good?'PASS':'FAIL')+' '+JSON.stringify({panel:p,close:b,reference:reference,hint:h,image:i,underPoint:center(rect('under')),closePoint:center(b)}));
 console.log('LOAD-PROBE-LOAD');
});
</script>
