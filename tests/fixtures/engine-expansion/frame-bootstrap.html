<!doctype html><meta charset=utf-8><title>Frame bootstrap wiring</title>
<h1>Parser and dynamic frame bootstrap</h1>
<p>This checks frame script execution. Embedded document painting remains unsupported.</p>
<iframe id=parser srcdoc="&lt;script&gt;self.__bootCount=(self.__bootCount||0)+1;console.log('FRAME-WIDGET-RAN count='+self.__bootCount);&lt;/script&gt;"></iframe>
<pre id=frame-result>Running…</pre>
<script>
var parserFrame=document.getElementById('parser');
var dynamicFrame=document.createElement('iframe');
dynamicFrame.srcdoc=parserFrame.getAttribute('srcdoc');
document.body.appendChild(dynamicFrame);
var parentStable=parserFrame.contentDocument!==dynamicFrame.contentDocument&&document.getElementById('frame-result')!==null;
/* HTML sandboxing, not a refusal: sandbox="" gives the frame's document an
 * opaque origin, so its embedder's contentDocument is NULL and
 * contentWindow.document throws SecurityError. Every way of reaching a blank
 * document must carry the flags; a document that leaks is probed with a
 * script that must never run. */
var sandboxRefused=0;
['missing','empty-src','empty-srcdoc','invalid-src-update'].forEach(function(kind){
 var f=document.createElement('iframe');f.setAttribute('sandbox','');
 if(kind==='empty-src')f.setAttribute('src','');if(kind==='empty-srcdoc')f.setAttribute('srcdoc','');
 document.body.appendChild(f);
 if(kind==='invalid-src-update')f.setAttribute('src','http://');
 var doc=f.contentDocument,denied=false;
 try{f.contentWindow.document}catch(e){denied=e.name==='SecurityError'}
 if(doc===null&&denied)sandboxRefused++;
 else if(doc){try{var s=doc.createElement('script');s.textContent="console.log('FRAME-SANDBOX-BYPASS-RAN')";doc.getElementsByTagName('head')[0].appendChild(s)}catch(e){}}
});
/* allow-same-origin without allow-scripts: the document and its fresh realm
 * are the embedder's to use, but no script IN the document ever runs. */
var sameOriginReadable=0;
var so=document.createElement('iframe');so.setAttribute('sandbox','allow-same-origin');document.body.appendChild(so);
try{var sd=so.contentDocument,sw=so.contentWindow;
 if(sd&&sw.JSON&&sw.JSON!==JSON&&sw.JSON.parse('[3]')[0]===3)sameOriginReadable=1;
 var s2=sd.createElement('script');s2.textContent="console.log('FRAME-SANDBOX-NOSCRIPT-RAN')";sd.getElementsByTagName('head')[0].appendChild(s2);
}catch(e){console.log('FRAME-SANDBOX-SAMEORIGIN-ERROR '+e)}
/* allow-scripts allow-same-origin: an ordinary frame. */
var sa=document.createElement('iframe');sa.setAttribute('sandbox','allow-scripts allow-same-origin');
sa.srcdoc="<script>console.log('FRAME-SANDBOX-ALLOWED-RAN')<\/script>";document.body.appendChild(sa);
/* allow-scripts alone: an OPAQUE origin. Its embedder cannot reach in, and
 * -- because an about:blank/srcdoc document can only be hosted in a realm on
 * its embedder's own runtime, which is no cross-origin boundary -- its script
 * does not run at all (a logged refusal). If it ever did run, it would try
 * the embedder's state first; none of these secrets may ever reach a
 * [frame] line. */
window.PARENT_SECRET='PSECRET-7f3';
try{localStorage.setItem('k','LSSECRET-7f3')}catch(e){}
try{document.cookie='sid=CKSECRET-7f3'}catch(e){}
var sx=document.createElement('iframe');sx.setAttribute('sandbox','allow-scripts');
sx.srcdoc="<script>function t(f){try{return String(f())}catch(e){return e.name}}"+
 "console.log('FRAME-SANDBOX-OPAQUE-RAN '+[t(function(){return parent.PARENT_SECRET}),t(function(){return top.document.cookie}),"+
 "t(function(){return parent.localStorage.getItem('k')}),t(function(){return document.cookie}),t(function(){return localStorage.getItem('k')}),"+
 "t(function(){return frameElement.ownerDocument.cookie})].join(','))<\/script>";
document.body.appendChild(sx);
var opaqueDenied=sx.contentDocument===null&&
 (function(){try{sx.contentWindow.document;return false}catch(e){return e.name==='SecurityError'}})()&&
 (function(){try{sx.contentWindow.JSON;return false}catch(e){return e.name==='SecurityError'}})()&&
 (function(){try{return 'JSON' in sx.contentWindow,false}catch(e){return e.name==='SecurityError'}})()&&
 Object.keys(sx.contentWindow).indexOf('document')<0&&
 typeof sx.contentWindow.postMessage==='function'?1:0;
/* HTML CrossOriginProperties answer for an opaque frame instead of throwing,
 * and a cross-origin `location` assignment is a navigation, not an error. */
var sxw=sx.contentWindow,opaqueAllowlist=0;
try{if(sxw.closed===false&&sxw.length===0&&sxw.opener===null&&sxw.frames===sxw&&sxw.window===sxw&&sxw.self===sxw&&
 sxw.top===window&&sxw.parent===window&&typeof sxw.focus==='function'&&typeof sxw.blur==='function'&&typeof sxw.close==='function')opaqueAllowlist=1;
 sxw.focus();sxw.blur();sxw.close();sxw.location='about:blank';}catch(e){opaqueAllowlist=0;console.log('FRAME-SANDBOX-ALLOWLIST-ERROR '+e)}
document.getElementById('frame-result').textContent=parentStable?'Parent DOM intact. Serial must contain exactly two FRAME-WIDGET-RAN count=1 lines.':'Parent DOM failure';
console.log('FRAME-WIDGET-PARENT stable='+parentStable);
console.log('FRAME-WIDGET-SANDBOX refused='+sandboxRefused+' sameOrigin='+sameOriginReadable+' opaque='+opaqueDenied);
window.frameAuditReady=true;
</script>
