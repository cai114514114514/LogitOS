<!doctype html><meta charset="utf-8"><title>Logical margin dialog</title>
<style>
body{margin:0;font:16px sans-serif;background:#f3f6fc}
#opener{display:block;width:160px;height:36px;margin:20px}
#wrap{display:none;position:fixed;inset:20px 30px;justify-content:center;background:rgba(0,0,0,.25)}
#panel{box-sizing:border-box;width:300px;height:160px;padding:12px;border:2px solid #26785c;background:white;margin-block:auto}
#close{display:block;width:100px;height:32px;margin-inline:auto}
#status{margin:20px}
</style>
<button id="opener">Open ordinary dialog</button><p id="status">Ready</p>
<div id="wrap"><section id="panel" role="dialog" aria-label="Layout test"><h2>Centered panel</h2><button id="close">Close</button></section></div>
<script>
// The driver uses ordinary native button activation. Rects observe the layout
// after the page's own state change; they never set or repair its geometry.
var openButton=document.getElementById('opener'),closeButton=document.getElementById('close');
var wrapper=document.getElementById('wrap'),panel=document.getElementById('panel');
function center(r){return {x:r.left+r.width/2,y:r.top+r.height/2}}
openButton.addEventListener('click',function(){
 wrapper.style.display='flex';closeButton.focus();
 var w=wrapper.getBoundingClientRect(),p=panel.getBoundingClientRect(),b=closeButton.getBoundingClientRect();
 var ey=w.top+(w.height-p.height)/2,ex=p.left+(p.width-b.width)/2;
 var good=Math.abs(p.top-ey)<=1&&Math.abs(b.left-ex)<=1;
 console.log('LOGICAL-MARGIN OPEN '+(good?'PASS':'FAIL')+' '+JSON.stringify({panel:{x:p.left,y:p.top,w:p.width,h:p.height},expectedY:ey,close:center(b),buttonX:b.left,expectedButtonX:ex}));
});
closeButton.addEventListener('click',function(){
 wrapper.style.display='none';openButton.focus();document.getElementById('status').textContent='Native dialog closed';
 console.log('LOGICAL-MARGIN CLOSED focus='+ (document.activeElement===openButton));
});
console.log('LOGICAL-MARGIN OPENER '+JSON.stringify(center(openButton.getBoundingClientRect())));
console.log('LOAD-PROBE-SCRIPT');window.addEventListener('load',function(){console.log('LOAD-PROBE-LOAD')});
</script>
