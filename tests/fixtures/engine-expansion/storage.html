<!doctype html><meta charset="utf-8"><title>Local Storage Persistence</title>

<h1>Storage across browser restart</h1>
<p>Write a marker, close and reopen the browser, then read it again. The local marker must survive. The session marker must disappear.</p>
<button id="storage-write">Write marker</button><button id="storage-read">Read marker</button><button id="storage-clear">Clear marker</button>
<pre id="storage-result">Reading saved state...</pre>
