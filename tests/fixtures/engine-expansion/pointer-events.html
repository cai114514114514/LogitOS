<!doctype html><meta charset="utf-8"><title>Pointer events inheritance</title><style>body{margin:0;font:18px sans-serif}#under{position:fixed;left:40px;top:80px;width:240px;height:40px;background:#d6ffe0;border:0;padding:0;font:18px sans-serif}#cover{position:fixed;left:40px;top:80px;width:240px;height:40px;pointer-events:none;border:2px solid red;box-sizing:border-box;z-index:4}#override{position:absolute;left:260px;top:0;width:100px;height:40px;pointer-events:auto}p{margin:150px 40px 0}#result{margin-top:20px}</style><input id="under" aria-label="Native pointer target" value="Type here"><div id="cover"><button id="override">Auto child</button></div><p>The red outline ignores pointer hits; its green input accepts typing. The Auto child button restores targeting inside the none ancestor. Tab must still reach both controls.</p><p id="result"></p><script>var under=document.getElementById('under'),cover=document.getElementById('cover'),child=document.getElementById('override');var r=under.getBoundingClientRect(),q=child.getBoundingClientRect(),x=Math.floor(r.x+r.width/2),y=Math.floor(r.y+r.height/2);var hit=document.elementFromPoint(x,y),autoHit=document.elementFromPoint(q.x+q.width/2,q.y+q.height/2);var ok=CSS.supports('pointer-events','none')&&getComputedStyle(cover).pointerEvents==='none'&&getComputedStyle(child).pointerEvents==='auto'&&hit===under&&autoHit===child;var msg='POINTER-EVENTS '+(ok?'PASS':'FAIL')+' point='+x+','+y+' hit='+(hit?hit.id:'null')+' child='+q.x+','+q.y+','+q.width+','+q.height+' auto='+(autoHit?autoHit.id:'null');console.log(msg);document.getElementById('result').textContent=msg;under.addEventListener('input',function(){console.log('POINTER-EVENTS INPUT '+under.value)});child.addEventListener('click',function(){console.log('POINTER-EVENTS AUTO CLICK')});cover.addEventListener('click',function(){console.log('POINTER-EVENTS ANCESTOR BUBBLE')});</script>
