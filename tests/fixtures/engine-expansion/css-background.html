<!doctype html><meta charset="utf-8"><title>CSS background and rounded borders</title>
<style>
html,body{margin:0;padding:0;background:white;}
.tile{position:absolute;box-sizing:border-box;width:100px;height:60px;}
#transparent{left:10px;top:10px;background-color:#ff0000;background-image:linear-gradient(transparent,transparent);}
#half{left:120px;top:10px;background-color:#ff0000;background-image:linear-gradient(rgba(0,0,255,.5),rgba(0,0,255,.5));}
#opaque{left:230px;top:10px;background-color:#ff0000;background-image:linear-gradient(#0000ff,#0000ff);}
#corners{left:10px;top:80px;background-color:#ff0000;background-image:linear-gradient(#0000ff,#0000ff);border-radius:0 20px 0 10px;}
#bottom{left:120px;top:80px;background:#ffffff;border-bottom:6px solid #ff0000;border-radius:12px;}
#edges{left:230px;top:80px;background:#ffffff;border-top:4px solid #ff0000;border-right:8px solid #00ff00;border-bottom:6px solid #0000ff;border-left:10px solid #ffff00;border-radius:18px 12px 8px 0;}
#outline{left:10px;top:150px;border:4px solid #00ff00;border-radius:0 18px 0 10px;}
#ellipse{left:120px;top:150px;background:#0000ff;border-radius:50%;}
#opposite{left:230px;top:150px;width:100px;height:100px;background:#0000ff;border-radius:90px 10px 90px 10px;}
#clip{left:10px;top:270px;overflow:hidden;border-radius:0 24px 0 0;}
#clip div{width:100px;height:60px;background:#0000ff;}
#clipgradient{left:120px;top:270px;overflow:hidden;border-radius:0 24px 0 0;}
#clipgradient div{width:100px;height:60px;background-image:linear-gradient(#0000ff,#0000ff);}
#hidden{left:10px;top:340px;background:#ffffff;border-top:4px solid transparent;border-right:8px solid #00ff00;border-bottom:6px solid #ff0000;border-radius:12px;}
#opacity{left:230px;top:270px;background-color:#ff0000;background-image:linear-gradient(transparent,transparent);border:6px solid #0000ff;border-radius:8px;opacity:.5;}
</style>
<div class="tile" id="transparent"></div><div class="tile" id="half"></div><div class="tile" id="opaque"></div>
<div class="tile" id="corners"></div><div class="tile" id="bottom"></div><div class="tile" id="edges"></div>
<div class="tile" id="outline"></div><div class="tile" id="ellipse"></div><div class="tile" id="opposite"></div>
<div class="tile" id="clip"><div></div></div><div class="tile" id="clipgradient"><div></div></div>
<div class="tile" id="hidden"></div>
<div class="tile" id="opacity"></div>
