<!doctype html><meta charset=utf-8><title>Native element scrolling</title>
<style>body{margin:20px;font:18px sans-serif}#scroller{width:320px;height:140px;overflow:auto;border:3px solid #123456;background:#e8f0ff}#pad{height:180px}#target{height:60px;background:#ee2244;color:white}#tail{height:220px}#result{white-space:pre-wrap}</style>
<h1>Element scroll: paint, geometry, input</h1>
<div id=scroller><div id=pad>Hidden after scrolling</div><div id=target>CLICK THE RED TARGET</div><div id=tail>Scroll inside this box</div></div>
<p id=result>Running</p>
<script>
var scroller=document.getElementById('scroller'),target=document.getElementById('target'),result=document.getElementById('result'),events=0,checks=0,failures=[];
function check(ok,label){checks++;if(!ok)failures.push(label)}
scroller.addEventListener('scroll',function(){events++;console.log('ELEMENT-SCROLL-EVENT '+scroller.scrollTop)});
target.addEventListener('click',function(){console.log('ELEMENT-SCROLL-CLICK');result.textContent+='\nReal mouse hit the scrolled target.'});
var before=target.getBoundingClientRect().top;scroller.scrollTop=180;
check(before-target.getBoundingClientRect().top===180,'child geometry moves');
check(scroller.scrollTop===180,'native clamp keeps valid offset');
var rect=target.getBoundingClientRect();check(document.elementFromPoint(rect.left+10,rect.top+10)===target,'CSSOM hit moves');
check(window.scrollY===0,'viewport stays still');
setTimeout(function(){check(events===1,'coalesced native scroll event');result.textContent='Element scroll checks: '+checks+', failures: '+failures.length+'\n'+failures.join('\n');console.log('ELEMENT-SCROLL-WIRING checks='+checks+' failures='+failures.length);console.log('ELEMENT-SCROLL-TARGET x='+(rect.left+10)+' y='+(rect.top+10));},100);
</script>
