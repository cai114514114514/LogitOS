<!doctype html>
<meta charset="utf-8">
<title>Dynamic script resource events</title>
<style>body{font:18px sans-serif;margin:24px}#state{white-space:pre-wrap}</style>
<h1>Dynamic script resource events</h1>
<p>This page uses ordinary external scripts and their native resource events.</p>
<div id="state">Waiting for resource events.</div>
<script>
window.resourceExecuted=[];window.resourceEvents=[];
function report(){
 var v={executed:resourceExecuted,events:resourceEvents};
 document.getElementById('state').textContent=JSON.stringify(v);
 console.log('SCRIPT-RESOURCE '+JSON.stringify(v));
}
function insertResource(name,path){
 var s=document.createElement('script');s.src=path;
 s.onload=function(e){resourceEvents.push(name+':load');if(name==='first')insertResource('chain','script-resource-chain.js');report();};
 s.onerror=function(e){resourceEvents.push(name+':error');report();};
 document.head.appendChild(s);
}
setTimeout(function(){
 insertResource('first','script-resource-first.js');
 insertResource('empty','script-resource-empty.js');
 insertResource('throws','script-resource-throws.js');
 insertResource('missing','script-resource-intentionally-missing.js');
},20);
setTimeout(function(){report();console.log('SCRIPT-RESOURCE-READY');},1200);
</script>
