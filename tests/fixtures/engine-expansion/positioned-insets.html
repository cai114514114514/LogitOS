<!doctype html><meta charset="utf-8"><title>Positioned search and navigation</title><style>html,body{margin:0}body{font:18px sans-serif;min-height:1800px}.search{position:fixed;top:20%;left:0;right:0;margin:0 auto;width:320px;height:52px;z-index:3;background:#ecf4ff;display:flex;align-items:center}input{width:280px;height:28px;padding:0;border:0;background:white;font:18px sans-serif}.nav{position:fixed;top:0;left:0;right:0;margin:0 auto;width:320px;height:39px;z-index:4;background:#254758;color:white}.explain{padding:220px 20px 20px;max-width:650px}</style><form class="search" id="form"><input id="query" value="Type here" aria-label="Search query"></form><a class="nav" id="nav" href="#navigation-target">Separate navigation target</a><div class="explain"><h1>Positioned percentages and auto margins</h1><p>The search box sits at 20% of the viewport height and stays centered. Click its white input: focus must reach the input, not the navigation above it. Scroll the page: both fixed boxes must stay in place.</p><p id="result"></p><button id="scroll" onclick="window.scrollBy(0,200)">Scroll down 200px</button><p id="navigation-target" style="margin-top:700px">Navigation destination</p></div><script>function reportPosition(){var q=document.getElementById('query'),f=document.getElementById('form').getBoundingClientRect(),r=q.getBoundingClientRect(),n=document.getElementById('nav').getBoundingClientRect(),px=Math.floor(r.x+r.width/2),py=Math.floor(r.y+r.height/2),hit=document.elementFromPoint(px,py);var ok=Math.abs(f.x-(innerWidth-320)/2)<=1&&f.y===Math.floor(innerHeight*.2)&&r.y===f.y+12&&n.y===0&&hit===q;var m=(ok?'PASS':'FAIL')+' form='+f.x+','+f.y+' query='+r.x+','+r.y+','+r.width+','+r.height+' point='+px+','+py+' hit='+(hit?hit.id:'null')+' scroll='+scrollY;document.getElementById('result').textContent=m;console.log('POSITIONED-INSETS '+m);}document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();console.log('POSITIONED-INSETS SUBMIT value='+document.getElementById('query').value)});window.addEventListener('scroll',reportPosition);reportPosition();</script>
