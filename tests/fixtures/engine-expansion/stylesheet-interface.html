<!doctype html><meta charset="utf-8"><title>DOM-owned stylesheet interface</title>
<style>body{margin:24px;font:18px sans-serif;background:#f3f6fc}#sample{width:40px;height:40px;background:#8b3545;color:white}button{display:inline-block;width:150px;height:40px;margin:12px 12px 12px 0}</style>
<h1>Stylesheet fallback and real rule mutations</h1>
<p id="status">Waiting for the stylesheet interface</p>
<div id="sample">Sample</div>
<button id="change">Change width</button><button id="restore">Restore width</button>
<script>
// Ordinary component fallback, with both a real DOM-owned sheet and a CSS
// result object. No adoption, constructor, shadow root, network or site name.
function appendFallback(value){
 var text=value instanceof CSSStyleSheet?Array.from(value.cssRules,function(r){return r.cssText}).join('\n'):value.cssText;
 var style=document.createElement('style');style.textContent=text;document.head.appendChild(style);return style;
}
function rect(id){var r=document.getElementById(id).getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height}}
function point(id){var r=rect(id);return {x:r.x+r.w/2,y:r.y+r.h/2}}
var sheet,inserted=-1;
document.getElementById('change').addEventListener('click',function(){
 if(!sheet||inserted>=0)return;
 inserted=sheet.insertRule('#sample{width:144px}',sheet.cssRules.length);
 // This deliberately measures the committed next frame. Synchronous author
// stylesheet refresh inside a JS CSSOM read is a separate acceptance gap.
 setTimeout(function(){var r=rect('sample'),ok=r.w===144;document.getElementById('status').textContent=ok?'Changed to 144 px':'Wrong changed width';console.log('CSS-SHEET CHANGED '+(ok?'PASS':'FAIL')+' '+JSON.stringify(r))},200);
});
document.getElementById('restore').addEventListener('click',function(){
 if(!sheet||inserted<0)return;
 sheet.deleteRule(inserted);inserted=-1;
 setTimeout(function(){var r=rect('sample'),ok=r.w===96;document.getElementById('status').textContent=ok?'Restored to 96 px':'Wrong restored width';console.log('CSS-SHEET RESTORED '+(ok?'PASS':'FAIL')+' '+JSON.stringify(r))},200);
});
console.log('LOAD-PROBE-SCRIPT');
window.addEventListener('load',function(){
 console.log('LOAD-PROBE-LOAD');
 if(typeof CSSStyleSheet!=='function'){console.log('CSS-SHEET READY FAIL missing-interface');return}
 appendFallback(document.styleSheets[0]);
 var owner=appendFallback({cssText:'#sample{width:96px;background:#26785c}'});
 sheet=document.styleSheets[document.styleSheets.length-1];
 setTimeout(function(){
  var r=rect('sample'),ok=sheet instanceof CSSStyleSheet&&sheet instanceof StyleSheet&&sheet.ownerNode===owner&&r.w===96;
  document.getElementById('status').textContent=ok?'Fallback applied: 96 px':'Fallback failed';
  console.log('CSS-SHEET READY '+(ok?'PASS':'FAIL')+' '+JSON.stringify({sample:r,change:point('change'),restore:point('restore')}));
 },200);
});
</script>
