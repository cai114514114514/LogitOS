<!doctype html><meta charset=utf-8><title>Calculated dialog insets</title>
<style>
:root{--space:.25rem;font-size:16px}body{margin:24px;font:18px sans-serif}
button{width:220px;height:40px;font:18px sans-serif}
#overlay{display:none;position:fixed;inset:calc(var(--space)*4);background:#ccddee;z-index:20}
#panel{margin:32px;padding:24px;background:white}
#close{display:block;margin-top:24px}
</style>
<h1>Ordinary dialog geometry and native clicks</h1>
<button id=open>Open ordinary dialog</button><div style="height:900px">Underlying document remains scrollable</div>
<div id=overlay role=dialog><div id=panel><h2>Visible calculated inset</h2><p>This is a local ordinary UI fixture, not a verification challenge.</p><button id=close>Close ordinary dialog</button></div></div>
<script>
var overlay=document.getElementById('overlay'),openButton=document.getElementById('open'),closeButton=document.getElementById('close');
function point(button,label){var r=button.getBoundingClientRect();console.log(label+' '+JSON.stringify({x:r.left+r.width/2,y:r.top+r.height/2}));}
openButton.addEventListener('click',function(){
 overlay.style.display='block';closeButton.focus();
 var r=overlay.getBoundingClientRect(),ok=r.left===16&&r.top===16&&r.width===innerWidth-32&&r.height===innerHeight-32;
 console.log('INSET-MATH-OPEN '+(ok?'PASS':'FAIL')+' '+JSON.stringify({left:r.left,top:r.top,width:r.width,height:r.height,vw:innerWidth,vh:innerHeight}));
 point(closeButton,'INSET-MATH-CLOSE-POINT');
});
closeButton.addEventListener('click',function(){overlay.style.display='none';openButton.focus();console.log('INSET-MATH-CLOSED');});
window.addEventListener('load',function(){point(openButton,'INSET-MATH-OPEN-POINT');});
</script>
