<!doctype html><meta charset="utf-8"><title>Auto-height absolute cover</title><style>body{font:18px sans-serif;margin:20px}.card{width:320px}.image{position:relative}.wrap{padding-top:56.25%;background:#dde5ec}.cover{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;background:#7bb5bd}.cover img{display:block;width:100%;height:100%}.stats{position:absolute;bottom:0;left:0;width:100%;height:38px;background:#163b4a;color:white}.info{margin-top:8px;height:44px}</style><h1>Auto-height absolute cover</h1><div class="card"><a><div id="image" class="image"><div class="wrap"><picture id="cover" class="cover"><img id="img" alt="Image occupies the ratio frame"></picture></div><div id="stats" class="stats">Statistics at the bottom</div></div></a><div id="info" class="info">Title below the image</div></div><p id="result"></p><script>var image=document.getElementById('image').getBoundingClientRect(),cover=document.getElementById('cover').getBoundingClientRect(),img=document.getElementById('img').getBoundingClientRect(),stats=document.getElementById('stats').getBoundingClientRect(),info=document.getElementById('info').getBoundingClientRect();var ok=image.height===180&&cover.height===180&&img.height===180&&stats.y-image.y===142&&info.y-image.y===188;var m=(ok?'PASS':'FAIL')+' frame='+image.height+' cover='+cover.height+' img='+img.height+' stats='+(stats.y-image.y)+' title='+(info.y-image.y);document.getElementById('result').textContent=m;console.log('ABSOLUTE-AUTO-HEIGHT '+m);</script>
