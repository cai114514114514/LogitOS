<!doctype html><meta charset="utf-8"><title>Transparent group visibility</title><style>body{font:18px sans-serif;margin:20px;color:#17334b}#group{opacity:0;transition:opacity .2s}#child{height:60px;width:320px;background:#dd3344;color:white}.bar{height:20px;width:320px;background:#228855}button{margin-top:20px}</style><h1>Transparent group visibility</h1><p>The red box starts invisible. The green bar stays in place.</p><div id="group"><div id="child">Red group content</div></div><div class="bar"></div><button id="show">Show red</button><button id="hide">Hide red</button><p id="result"></p><script>var group=document.getElementById('group'),child=document.getElementById('child'),result=document.getElementById('result');function report(){var op=getComputedStyle(group).opacity;result.textContent='opacity='+op+' child height='+child.getBoundingClientRect().height;console.log('OPACITY-GROUP '+result.textContent)}document.getElementById('show').onclick=function(){group.style.opacity='1';report()};document.getElementById('hide').onclick=function(){group.style.opacity='0';report()};report();</script>
