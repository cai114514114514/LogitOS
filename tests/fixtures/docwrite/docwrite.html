<!doctype html>
<!-- The document.write gate fixture. Served from the host by
     tests/qmp/qmp_docwrite.py, which asserts on the serial markers and on the
     pixel blocks below -- see that file for what each block proves.

     Block colours are deliberately odd (and unique) so the harness can locate
     each one in a screendump without OCR or hardcoded coordinates, the same
     trick tests/qmp/qmp_live_page.py uses. Single-word labels on purpose:
     layout emits one text box per word.

     The order of the blocks on screen is the assertion: fromhead is written
     by the script inside <head> (it must land at the TOP of the body, where
     a spec browser's "in head" insertion mode puts body-flow content), w1
     and w2 are written by the FIRST body script (two document.write calls,
     which must land in call order between the script and the markup that
     follows it in the source), w3 is writeln'd by the SECOND body script,
     and the vertical order on screen has to read
     fromhead < before < w1 < w2 < after < w3 < last -- the DOM order a real
     browser's parser produces, because the written markup goes into the
     input stream just before the insertion point.

     The WRITTEN <script> (script 1's third write) exercises the one part of
     the spec a fragment-parsing engine gets wrong for free: in a real
     browser written input goes through the MAIN parser, which runs the
     script; the fragment algorithm (innerHTML) marks it "already started"
     and runs it never. It must RUN here, and it must itself be able to
     write (w4, which lands after it -- the nested insertion point). The
     source splits '</scr' + 'ipt>' because a literal </script> would end
     the PARSING of script 1 itself: the HTML tokenizer inside the inline
     script's text looks for that byte sequence, not for JS string quotes. -->
<html><head><title>docwrite</title><style>
html, body { background: #ffffff; margin: 0; padding: 0; color: #000000; }
div { display: block; font-size: 30px; color: #000000; }
</style>
<!-- A write from INSIDE <head>. In a spec browser the "in head" insertion
     mode pops to <body> for body-flow content, so this block must land at
     the TOP of the body -- before source body content, not after it. The
     tempting wrong implementation (append at body end) puts it at the
     bottom; the harness's y-order assertion catches both that and a
     body.firstChild miss. -->
<script>
  document.write('<div id="fromhead" style="background:#7f7f01">HEADWRITE</div>');
</script>
</head><body>
<div id="before" style="background:#017ffe">BEFOREBLOCK</div>
<script>
  console.log('DW-SCRIPT1-RAN');
  document.write('<div id="w1" style="background:#fe0102">WRITTENONE</div>');
  document.write('<div id="w2" style="background:#02fe01">WRITTENTWO</div>');
  document.write('<scr' + 'ipt>console.log("DW-WRITTEN-SCRIPT-RAN");'
                 + 'document.write(\'<div id="w4" style="background:#01fefe">NESTEDWRITE</div>\');'
                 + '</scr' + 'ipt>');
  console.log('DW-SCRIPT1-DONE');
</script>
<div id="after" style="background:#7f01fe">AFTERBLOCK</div>
<script>
  /* The python.org shape: a LATER script reads back what an earlier one
     wrote. In a spec browser the write is in the stream before this script's
     source, so w1 must already be an element here. */
  var w1 = document.getElementById('w1');
  console.log('DW-W1-READ ' + (w1 ? w1.textContent : 'null'));
  console.log('DW-SCRIPT2-RAN');
  document.writeln('<div id="w3" style="background:#0102fe">WRITTENTHREE</div>');
  console.log('DW-SCRIPT2-DONE');
</script>
<div id="last" style="background:#fe017f">LASTBLOCK</div>
<script>
  /* DOM order as the page itself sees it, from a script that ran after both
     writers. Elements only -- the writeln newline is a text node and is
     checked separately below. NOTE w4 is NOT here: this script is
     parse-collected, it runs BEFORE the engine drains written scripts, and
     w4 is written by the WRITTEN script -- the one timing deviation this
     engine documents (a spec browser interleaves; here written scripts run
     one drain later). ORDER2 below, logged from the timer after everything
     has run, must then include it. */
  var order = [];
  for (var n = document.body.firstChild; n; n = n.nextSibling)
    if (n.id) order.push(n.id);
  console.log('DW-DOM-ORDER ' + order.join(','));
  /* writeln = write + newline: the node after w3 must be the U+000A text
     node writeln appends, not another element. */
  try {
    var t3 = document.getElementById('w3').nextSibling;
    if (t3 && t3.nodeType === 3 && t3.data === '\n') console.log('DW-WLN-NEWLINE-OK');
    else console.log('DW-WLN-NEWLINE-BAD');
  } catch (e) { console.log('DW-WLN-NEWLINE-BAD'); }
  /* THE NEGATIVE CONTROL'S SUBJECT: a write from a TIMER, after the page has
     finished loading. The spec's ignore-destructive-writes shape (and the
     mission's rule): this must contribute NOTHING -- the DOM order log below
     must be identical to the one above PLUS w4 (the written script's own
     write, which has run by now), and the orange block must never appear on
     screen. A tempting wrong implementation appends it at the end of the
     body; both assertions catch exactly that. */
  setTimeout(function () {
    document.write('<div id="late" style="background:#fe7f01">LATEWRITE</div>');
    var order2 = [];
    for (var n = document.body.firstChild; n; n = n.nextSibling)
      if (n.id) order2.push(n.id);
    console.log('DW-DOM-ORDER2 ' + order2.join(','));
    console.log('DW-LATE-WROTE');
  }, 6000);
</script>
</body></html>
