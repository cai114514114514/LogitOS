<!doctype html>
<html><head><meta charset="utf-8"><title>type census</title></head>
<body>
<div id="d">type census</div>
<!--
  THE TYPE CENSUS -- a pure TYPE differential over the whole surface this
  browser publishes, taken in the guest, by the real browser, from a page.

  WHY A PAGE AND NOT A HOST PROBE. tests/unit/webapi_probe.c does not link every
  translation unit browser.aex links -- it missed js_media_src.c once and
  reported a whole live subsystem absent. A type survey run in the probe
  measures the probe. This is an ordinary document: it goes through the same
  HTML -> DOM -> script path as any site, in browser.aex, with nothing bypassed
  and nothing stubbed.

  WHY TYPE AND NOT PRESENCE. This tree has paid four times for one name on one
  interface, and the first three were ABSENCE -- Node.isEqualNode,
  document.currentScript, Element.insertAdjacentElement. The fourth was a WRONG
  TYPE, which is strictly worse, and the corpus proves it rather than arguing
  it (tests/fixtures/jsperf/baidu-async-search.js):

      var o = a.getContext === i ? !1 : a.getContext("2d");
      if (o === !1) return !1;

  Absent, that guard fires and the page takes its fallback. Present with the
  wrong type, the guard does not fire and the page walks on holding the wrong
  thing -- or calls it and dies with
  `TypeError: <name> is not a function (it is the number N)`.
  Hence the rule this file exists to enforce: ABSENT BEATS PRESENT-AND-WRONG.

  WHY IT NEEDS NO REFERENCE BROWSER. tests/fixtures/frameworks/CHROMEDIFF was
  the obvious oracle and it is not one: it is an EXCEPTION differential and
  carries no type information at all. build/wpt has no `interfaces/` directory,
  so there are no .idl files here either, and node has the JS builtins but no
  DOM. Rather than invent a fifth oracle nobody asked for, the findings below
  are the ones that are wrong in EVERY browser, so no reference run is needed:

    P1  A prototype member that is a plain primitive data property and is not
        SCREAMING_SNAKE. Web IDL puts exactly three things on an interface
        prototype -- operations (functions), attributes (accessors), and
        constants -- and constants are the only data properties, by convention
        upper-case. `typeof el.foo === "number"` where the spec says operation
        cannot be right anywhere.
    P2  A member whose name begins with `__` on a PUBLIC interface prototype.
        That is an internal name in a namespace the page can see, enumerate and
        collide with. It is ours by construction: no specification defines one.
    P3  An ENUMERABLE own member on an interface prototype. Every Web IDL member
        is enumerable:false... on the prototype the page walks with `for...in`.
        An enumerable one shows up in every `for (var k in element)` on the web.

  P1's allow-list is short, argued, and spelled out below rather than hidden in
  a regex: ECMAScript really does put `message` (a string) and `name` (a string)
  as data properties on every native Error prototype (ES2024 20.5.3.2/.3), so
  those are not findings anywhere.

  The output is bracketed by TYPECENSUS-BEGIN/END so a harness can lift it out
  of a serial log carrying everything else the machine says.
-->
<script>
(function () {
  var G = (typeof globalThis !== 'undefined') ? globalThis : window;
  var L = [];
  function say(s) { L.push(s); }

  /* The kind of one own property, WITHOUT EVER READING AN ACCESSOR. Invoking a
   * getter to learn a type runs page-visible code inside an instrument: it can
   * throw, hang, or mutate the thing being measured. Same argument
   * js_callee_atom makes for refusing toString() while building a diagnostic. */
  function desc(o, k) {
    try { return Object.getOwnPropertyDescriptor(o, k); } catch (e) { return null; }
  }
  function ownNames(o) {
    try { return Object.getOwnPropertyNames(o).sort(); } catch (e) { return []; }
  }
  function isConst(n) { return /^[A-Z][A-Z0-9_]*$/.test(n); }

  /* Members every object carries and no interface declares. */
  var SKIP = { constructor: 1, __proto__: 1, prototype: 1, length: 1, name: 1,
               caller: 1, arguments: 1 };

  /* ES2024 20.5.3: Error.prototype.message and .name ARE data properties in
   * every conforming engine. Listed by name so the exception is visible. */
  function esErrorData(label, n) {
    return (n === 'message' || n === 'name') && /Error\.prototype$/.test(label);
  }

  var finds = 0, members = 0, ifaces = 0;
  var nP1 = 0, nP2 = 0, nP3 = 0;

  function survey(label, obj, isProto) {
    if (!obj || (typeof obj !== 'object' && typeof obj !== 'function')) return;
    var ns = ownNames(obj), row = [];
    for (var i = 0; i < ns.length; i++) {
      var n = ns[i];
      if (SKIP[n]) continue;
      var d = desc(obj, n);
      if (!d) continue;
      var k = (d.get || d.set) ? 'accessor' : typeof d.value;
      if (k === 'undefined') continue;
      members++;
      row.push(n + '=' + k + (d.enumerable ? '+e' : ''));
      if (!isProto) continue;                 /* P1..P3 are prototype rules */

      if (n.indexOf('__') === 0) {
        nP2++; finds++;
        say('FIND P2 ' + label + '.' + n + ' is an internal name on a public '
            + 'prototype (' + k + (d.enumerable ? ', enumerable' : '') + ')');
        continue;                             /* one finding per member */
      }
      if ((k === 'number' || k === 'string' || k === 'boolean') &&
          !isConst(n) && !esErrorData(label, n)) {
        nP1++; finds++;
        say('FIND P1 ' + label + '.' + n + ' is a ' + k
            + ' where only an operation, an attribute or a CONSTANT may be');
        continue;
      }
      if (d.enumerable) {
        nP3++; finds++;
        say('FIND P3 ' + label + '.' + n + ' is enumerable on a prototype');
      }
    }
    if (!row.length) return;
    ifaces++;
    /* Chunked: one interface can carry eighty members and a serial line is not
     * unbounded. */
    var line = '', pfx = 'T ' + label + ' ';
    for (var j = 0; j < row.length; j++) {
      if (line.length + row[j].length > 300) { say(pfx + line); line = ''; }
      line += (line ? ' ' : '') + row[j];
    }
    if (line) say(pfx + line);
  }

  /* ---- THE NEGATIVE CONTROL, IN THIS FILE AND NOT A COPY OF IT ----------
   *
   * `?negctl` installs one member of each shape the rules above exist to catch,
   * on a public prototype, and the gate then requires the census to name all
   * three. A control living in a SECOND fixture would be a second copy of the
   * census script, and the day the two drift the control passes while the real
   * page measures nothing -- one jar, two doors. Here the control and the
   * measurement are the same forty lines, so a census that has stopped working
   * cannot report zero findings and still be believed.
   *
   * It is also the answer to "what would this look like if it were broken":
   * P1 is the shape Google's engine-thrown `TypeError: not a function (the
   * callee is a number)` was, P2 is an internal name leaking into a public
   * namespace, P3 is a member that shows up in every `for...in` on the web. */
  if (String(location.search).indexOf('negctl') >= 0) {
    try {
      var EP = G.Element && G.Element.prototype;
      if (EP) {
        Object.defineProperty(EP, 'negctlNumberOp',
                              { value: 42, configurable: true, enumerable: false });
        Object.defineProperty(EP, '__negctlInternal',
                              { value: true, configurable: true, enumerable: false });
        Object.defineProperty(EP, 'negctlEnumerableOp',
                              { value: function () {}, configurable: true, enumerable: true });
      }
    } catch (e) {}
    say('TYPECENSUS-NEGCTL armed');
  }

  say('TYPECENSUS-BEGIN');

  /* Every global that looks like an interface object: capitalised, callable,
   * with an object prototype. DERIVED FROM THE SURFACE, never a list -- a
   * hand-written list of "the APIs a browser needs" is a list of the APIs the
   * author remembers, which is webapi_probe.c's founding argument. */
  var gn = ownNames(G), seen = {};
  for (var i = 0; i < gn.length; i++) {
    var n = gn[i];
    if (!/^[A-Z]/.test(n)) continue;
    var v;
    try { v = G[n]; } catch (e) { continue; }
    if (typeof v !== 'function') continue;
    var p;
    try { p = v.prototype; } catch (e) { continue; }
    if (!p || typeof p !== 'object' || seen[n]) continue;
    seen[n] = 1;
    survey(n + '.prototype', p, true);
  }

  /* The singletons, censused but NOT judged: they are instances, and an
   * instance own-property may legitimately be a primitive data property in
   * some engines. They are here so the differential covers the surface a page
   * actually touches, not so P1..P3 can fire on them. */
  var sing = [['window', G], ['document', G.document], ['navigator', G.navigator],
              ['location', G.location], ['screen', G.screen], ['history', G.history],
              ['performance', G.performance], ['console', G.console],
              ['localStorage', G.localStorage], ['sessionStorage', G.sessionStorage],
              ['Math', G.Math], ['JSON', G.JSON], ['Reflect', G.Reflect]];
  for (var s = 0; s < sing.length; s++) {
    try { survey(sing[s][0], sing[s][1], false); } catch (e) {}
  }

  say('TYPECENSUS-SUM ifaces=' + ifaces + ' members=' + members
      + ' finds=' + finds + ' P1=' + nP1 + ' P2=' + nP2 + ' P3=' + nP3);
  say('TYPECENSUS-END');
  for (var q = 0; q < L.length; q++) console.log(L[q]);
  document.getElementById('d').textContent =
      'census: ' + members + ' members, ' + finds + ' finds';
})();
</script>
</body></html>
