<!doctype html>
<html><head><title>anim-kf</title><style>
/* THE KEYFRAMES GATE PAGE.
 *
 * Two boxes, two @keyframes rules, one 2 s linear window:
 *
 *   #fade   opacity 0 -> 1      (paint-time value; no layout involved)
 *   #slide  translateX 0 -> 100px
 *
 * At the mid-point of a linear 2 s animation #fade must be at alpha .5 over
 * the white page and #slide must be ~50px right of its start -- a frame that
 * equals NEITHER the first render NOR the end-state render. The end-state is
 * precisely what the pre-animation-clock browser showed at every t, which is
 * why tests/qmp/qmp_anim_page.py diffs the mid frame against BOTH ends and
 * why this page is also the negative control's subject: against the pre-fix
 * build the mid==end assertion goes red.
 *
 * linear (not the default ease) so the mid-frame value is exactly half and
 * the +/- 0.3 s of QEMU timing slop cannot push a screenshot past the
 * assertion margins.
 *
 * Odd colours so no desktop chrome or font antialiasing can collide. */
html, body { background: #ffffff; margin: 0; padding: 0; }
@keyframes animkffade { 0% { opacity: 0 } 100% { opacity: 1 } }
@keyframes animkfslide { 0% { transform: translateX(0) } 100% { transform: translateX(100px) } }
#fade {
  position: absolute; left: 60px; top: 30px; width: 140px; height: 140px;
  background: #fe0103; animation: animkffade 2s linear;
}
#slide {
  position: absolute; left: 60px; top: 210px; width: 140px; height: 140px;
  background: #0301fe; animation: animkfslide 2s linear;
}
</style></head>
<body>
<div id="fade"></div>
<div id="slide"></div>
<script>
/* Serial markers, on the GUEST clock. Scripts run strictly AFTER the sheet
 * was applied, so the animation clock is at t~=0 when this prints. MID and
 * END fire from setTimeout at 0.9 s / 1.9 s of the page's own clock: under
 * TCG the guest keeps its own rate relative to the host driver's
 * time.sleep (measured ~2x on this tree's runner, 2026-08-30), so a
 * host-scheduled "t=1 s" screenshot actually captured guest t~1.6-2 s --
 * past the end of the 2 s animation, where mid==end and the gate can never
 * pass. The page owns the timeline; the driver only waits for markers and
 * its ~0.2-0.5 s guest-time capture latency lands the shot near t~=1.2 s,
 * mid-curve with margin on both sides. */
console.log("ANIM-KF-READY");
setTimeout(function () { console.log("ANIM-KF-MID"); }, 900);
setTimeout(function () { console.log("ANIM-KF-END"); }, 1900);
</script>
</body></html>
