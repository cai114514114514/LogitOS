<!doctype html>
<html><head><title>anim-trans</title><style>
/* THE TRANSITION GATE PAGE.
 *
 * A class change is the only style-change trigger this tree has (:hover
 * matches nothing by design), so the page's script adds .on at t0 ~= 600 ms
 * and the transition must interpolate opacity .15 -> 1 over 2 s. At t0 + 1 s
 * the box must sit near alpha .575 -- a frame equal to NEITHER the pre-change
 * render NOR the end-state render. The pre-fix browser jumps straight to
 * opacity 1 at t0 (the end-state approximation), so the mid != end assertion
 * is the negative control and goes red against it.
 *
 * The transition is on the SHORTHAND: `transition: opacity 2s linear` is the
 * one spelling css_extra.c captures (longhand-only transitions are listed as
 * deliberately not captured -- see the css_extra.c comment). */
html, body { background: #ffffff; margin: 0; padding: 0; }
#box {
  position: absolute; left: 80px; top: 60px; width: 160px; height: 160px;
  background: #01fe03; opacity: 0.15;
  transition: opacity 2s linear;
}
#box.on { opacity: 1 }
</style></head>
<body>
<div id="box"></div>
<script>
/* Markers on the GUEST clock, same reason as kf.html's: the host driver's
 * sleeps do not track guest time under TCG. GO fires the class change at
 * +600 ms; MID at GO+900 ms so the driver's capture latency lands the
 * screenshot near t0+1.1-1.4 s of the 2 s transition (alpha ~0.6-0.75 --
 * neither the 0.15 pre-change render nor the 1.0 end-state). */
console.log("ANIM-TRANS-READY");
setTimeout(function () {
  document.getElementById("box").className = "on";
  console.log("ANIM-TRANS-GO");
  setTimeout(function () { console.log("ANIM-TRANS-MID"); }, 900);
  setTimeout(function () { console.log("ANIM-TRANS-END"); }, 2000);
}, 600);
</script>
</body></html>
