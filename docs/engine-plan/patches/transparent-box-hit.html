<!doctype html><meta charset="utf-8"><title>Transparent border-box hit specimen</title>
<style>body{margin:20px;font:16px sans-serif}.sample{display:block;width:180px;height:40px;margin:10px 0} .stage{position:relative;width:180px;height:40px;margin:10px 0}.stage .sample{margin:0}#cover{position:absolute;inset:0}#clip{width:90px;height:40px;overflow:hidden}pre{white-space:pre-wrap}</style>
<p>Use real mouse down/up at the printed points. No synthetic click is sent. The first link's blank right edge and center must activate it.</p>
<a id="plain" class="sample" href="transparent-box-hit-target.html?case=plain">Follow link</a>
<a id="painted" class="sample" style="background:#ddd" href="transparent-box-hit-target.html?case=painted">Painted control</a>
<div class="stage"><a id="under" class="sample" href="transparent-box-hit-target.html?case=covered">Underlying link</a><div id="cover"></div></div>
<div id="clip"><a id="clipped" class="sample" style="margin:0" href="transparent-box-hit-target.html?case=clip">Clipped link</a></div>
<a id="cancel" class="sample" href="transparent-box-hit-target.html?case=cancel">Cancelled link</a>
<pre id="log"></pre><script>
function log(s){document.getElementById('log').textContent+=s+'\n';console.log(s)}
['plain','painted','cover','clipped','cancel'].forEach(function(id){var n=document.getElementById(id),r=n.getBoundingClientRect();log(id+' client center '+(r.x+r.width/2)+','+(r.y+r.height/2)+' right blank '+(r.x+r.width-8)+','+(r.y+r.height-8));n.addEventListener('click',function(e){log('click '+id+' target='+e.target.id);if(id==='cancel')e.preventDefault()})});
</script>
