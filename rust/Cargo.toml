[package]
name = "logit_rust"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Hybrid C+Rust kernel: Rust is compiled to a freestanding staticlib and linked
# alongside the C objects (see the Makefile). It owns the memory-safety-critical
# untrusted-input parsers; the C kernel owns the core, drivers, and scheduler.
[lib]
crate-type = ["staticlib"]

# Negative controls. Each turns ONE documented VP8 rule off so the
# conformance suite can be watched failing; none is ever enabled in a real
# build, and `make test-webp-vp8-negctl` fails if enabling one does NOT break
# the suite. See tests/unit/webp_vp8_test.c.
[features]
default = []
# B_PRED above-right taken from the reconstructed subblock row instead of the
# row above the MACROBLOCK -- VP8's most-reimplemented bug.
vp8-tr-from-subblock = []
# DC_PRED treats its neighbours as available at the frame edge, averaging the
# 127/129 border rows into the DC instead of halving the sum -- the rule that
# only DC_PRED asks about availability at all.
vp8-dc-always-avail = []
# VP8 INTER frames (video): reference-frame management, MV decode, motion
# compensation. OFF the kernel build on purpose -- see rust/src/vp8_inter.rs's
# module doc and CLAUDE.md's video-decoders-are-ring-3 rule. A ring-3 consumer
# (browser/Preview, once wired) builds RUST_LIB with this feature turned on;
# the kernel's $(RUST_LIB) invocation never passes --features, so it never
# gets vp8_inter.rs or the inter-only tables it pulls in from vp8_tables.rs.
vp8-interframe = []
# NEGATIVE CONTROL for vp8-interframe: the sub-pixel interpolator applies its
# vertical 6-tap pass BEFORE the horizontal one (VP8's spec order is
# horizontal-then-vertical, observably different because the intermediate
# rounding/clamp to u8 happens between the two passes). Inert unless
# vp8-interframe is also enabled.
vp8-sixtap-swap = []
# NEGATIVE CONTROLS for the PNG ENCODER (rust/src/pngenc.rs). Each turns one
# documented rule off, and `make test-pngenc-negctl` fails if turning it off
# does NOT redden the gate it is supposed to redden. The interesting part is
# WHICH oracle catches which -- that is the argument for having two.
#
# The chunk CRC is computed with CRC-32C (Castagnoli, 0x82F63B78) instead of
# PNG's CRC-32/ISO-HDLC. A real polynomial a real person could pick. THIS ONE
# IS INVISIBLE TO THE ROUND-TRIP: rust/src/png.rs does not check chunk CRCs at
# all, so oracle 1 stays green and only tests/unit/pngenc_ext_test.py's
# binascii.crc32 sees it. It is the entire justification for a second oracle,
# expressed as a switch instead of as a paragraph.
pngenc-bad-crc = []
# Every stored deflate block claims BFINAL. Correct for a stream that fits in
# one 65535-byte block and a silent TRUNCATION for anything larger -- so this
# one is invisible at 1x1 and 37x11 and reddens only at 200x100 and up, which
# is what makes those sizes load-bearing rather than decorative.
pngenc-always-final = []

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"
